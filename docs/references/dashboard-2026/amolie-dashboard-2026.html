<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMOLIE Кабинет 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Piazzolla:ital,opsz,wght@0,8..30,300;0,8..30,400;1,8..30,300&display=swap">
<style>
/* ============================================================
   AMOLIE · Кабинет 2026 — прототип
   Токены кабинета: розово-серое поле, белая ячейка, розовый акцент
   времени и лиловый акцент итогов. Две темы.
   ============================================================ */

:root {
  /* Сцена прототипа — нейтральная, не зависит от темы кабинета */
  --stage: #141215;
  --stage-2: #1c191d;
  --stage-ink: #ece6e9;
  --stage-ink-2: rgba(236, 230, 233, 0.6);
  --stage-line: rgba(236, 230, 233, 0.12);
  --stage-accent: #e2568a;
  color-scheme: dark;
}

html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--stage);
  color: var(--stage-ink);
  font-family: "Golos Text", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--support, #9164c4); outline-offset: 2px; border-radius: 6px; }

/* ---------- Панель прототипа ---------- */
.proto { display: grid; grid-template-rows: 52px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.proto-bar {
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border-bottom: 1px solid var(--stage-line); background: var(--stage-2);
  font-size: 13px;
}
.proto-bar .brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; font-weight: 500; letter-spacing: 0.02em; }
.proto-bar .brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--stage-accent); display: inline-block; }
.proto-bar .brand small { color: var(--stage-ink-2); font-weight: 400; }
.proto-bar .sep { width: 1px; height: 22px; background: var(--stage-line); margin: 0 4px; }
.proto-bar label { color: var(--stage-ink-2); }
.proto-bar select, .proto-bar .pbtn {
  background: rgba(255,255,255,0.05); border: 1px solid var(--stage-line); color: var(--stage-ink);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; height: 32px;
}
.proto-bar select { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--stage-ink-2) 50%), linear-gradient(135deg, var(--stage-ink-2) 50%, transparent 50%); background-position: calc(100% - 15px) 13px, calc(100% - 10px) 13px; background-size: 5px 5px; background-repeat: no-repeat; }
.proto-bar .seg { display: inline-flex; background: rgba(255,255,255,0.05); border: 1px solid var(--stage-line); border-radius: 999px; padding: 2px; }
.proto-bar .seg button { padding: 4px 12px; border-radius: 999px; color: var(--stage-ink-2); font-size: 13px; height: 26px; }
.proto-bar .seg button.on { background: var(--stage-ink); color: var(--stage); }
.proto-bar .spacer { flex: 1; }
.proto-bar .hint { color: var(--stage-ink-2); font-size: 12px; white-space: nowrap; }
@media (max-width: 1500px) { .proto-bar .hint { display: none; } }
.proto-bar kbd { font: inherit; border: 1px solid var(--stage-line); border-radius: 4px; padding: 0 5px; }

.stage { position: relative; overflow: auto; display: grid; place-items: start center; padding: 0; min-height: 0; }
.device, .app { min-height: 0; }
.stage[data-device="desktop"] { place-items: stretch; }
.stage[data-device="desktop"] .device { width: 100%; height: 100%; }
.stage[data-device="phone"] { padding: 28px 0 40px; }
.stage[data-device="phone"] .device {
  width: 410px; height: 864px; border-radius: 46px; padding: 10px; background: #0a090b;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 40px 90px rgba(0,0,0,0.6);
  position: relative;
}
.stage[data-device="phone"] .device::before {
  content: ""; position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  width: 118px; height: 32px; border-radius: 999px; background: #0a090b; z-index: 5;
}
.stage[data-device="phone"] .app { border-radius: 38px; }
.stage[data-device="phone"] .app { --safe-top: 54px; --safe-bottom: 24px; }
.device { display: block; container-type: inline-size; container-name: app; }

/* ============================================================
   ТЕМЫ КАБИНЕТА
   ============================================================ */
.app {
  /* Светлая — почти белый поднос с лёгкой розово-серой примесью */
  --field: #F5F3F4;
  --cell: #FFFFFF;
  --sunken: #F2EEF0;
  --hover: #F8F5F7;
  --ink: #1F1A1C;
  --ink-2: rgba(31, 26, 28, 0.70);
  --ink-3: rgba(31, 26, 28, 0.48);
  --line: rgba(31, 26, 28, 0.09);
  --line-2: rgba(31, 26, 28, 0.18);

  --accent: #D64F7F;
  --accent-ink: #B03A66;          /* розовый как текст на белом */
  --accent-deep: #C0426F;
  --on-accent: #FFFFFF;
  --support: var(--accent);
  --support-strong: var(--accent-deep);
  --on-support: #FFFFFF;
  --cell-rose: #FBDFE9;
  --cell-lilac: #1F1A1C;
  --rose-ink: #7A2648;
  --lilac-ink: #F5F3F4;

  --ok: #2E7A58; --ok-soft: #DDF0E6;
  --warn: #9A6712; --warn-soft: #F8EBD2;
  --danger: #C0392B; --danger-soft: #F9E1DD;

  /* Палитра людей: шесть оттенков, живущих рядом с розой и мальвой. Каждому мастеру — свой. */
  --m1: #D64F7F; --m1-soft: #FBDFE9; --m1-ink: #7A2648;
  --m2: #9164C4; --m2-soft: #ECE0F7; --m2-ink: #3F2560;
  --m3: #3E8F6E; --m3-soft: #DCEFE4; --m3-ink: #1F4D37;
  --m4: #C98A2B; --m4-soft: #F8EBD2; --m4-ink: #6A4410;
  --m5: #2F8C9C; --m5-soft: #D9EDF0; --m5-ink: #174850;
  --m6: #D96B4C; --m6-soft: #FAE3DB; --m6-ink: #6E2E1B;

  --shadow-cell: 0 1px 2px rgba(31, 26, 28, 0.04), 0 12px 28px -18px rgba(31, 26, 28, 0.18);
  --shadow-float: 0 24px 64px -20px rgba(31, 26, 28, 0.35), 0 2px 6px rgba(31, 26, 28, 0.06);
  --cell-line: rgba(31, 26, 28, 0.06);

  --r-field: 12px; --r-card: 16px; --r-panel: 20px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --safe-top: 0px; --safe-bottom: 0px;

  --font-ui: "Golos Text", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Piazzolla", "Georgia", serif;

  color-scheme: light;
  position: relative; width: 100%; height: 100%;
  background: var(--field); color: var(--ink); font-family: var(--font-ui);
  overflow: hidden; display: grid; grid-template-columns: 240px 1fr;
}
.app[data-theme="dark"] {
  --field: #0E0E10;
  --cell: #1E1B1F;
  --sunken: #17151A;
  --hover: #26222A;
  --ink: #F3ECEF;
  --ink-2: rgba(243, 236, 239, 0.72);
  --ink-3: rgba(243, 236, 239, 0.50);
  --line: rgba(243, 236, 239, 0.10);
  --line-2: rgba(243, 236, 239, 0.20);
  --accent: #C4688B;
  --accent-ink: #E3A3BC;
  --accent-deep: #D07A9C;
  --on-accent: #1A0A11;
  --support: var(--accent);
  --support-strong: var(--accent-deep);
  --on-support: #1A0A11;
  --cell-rose: #3B2029;
  --cell-lilac: #2A1D24;
  --rose-ink: #F5C3D6;
  --lilac-ink: #F7E9F0;
  --ok: #5DBA8B; --ok-soft: #14301F;
  --warn: #E2AE5D; --warn-soft: #38290F;
  --danger: #E8776B; --danger-soft: #3B1F1C;
  --m1: #C4688B; --m1-soft: #3B2029; --m1-ink: #F0C6D6;
  --m2: #A87FD0; --m2-soft: #2C2340; --m2-ink: #DCCBF0;
  --m3: #5DBA8B; --m3-soft: #1E3A2B; --m3-ink: #B9E2CB;
  --m4: #E0A857; --m4-soft: #45321A; --m4-ink: #F0D5A8;
  --m5: #5FB7C6; --m5-soft: #163A40; --m5-ink: #B4E0E6;
  --m6: #EF8C6E; --m6-soft: #46261C; --m6-ink: #F3C4B4;
  --shadow-cell: none;
  --shadow-float: 0 30px 80px -20px rgba(0, 0, 0, 0.8);
  --cell-line: rgba(243, 236, 239, 0.08);
  color-scheme: dark;
}

/* ============================================================
   ТИПОГРАФИКА
   ============================================================ */
.t-display { font-family: var(--font-display); font-weight: 300; letter-spacing: -0.02em; line-height: 1.02; }
.t-title { font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: -0.02em; line-height: 1.05; }
.t-section { font-size: 15px; font-weight: 500; letter-spacing: -0.005em; margin: 0; }
.t-meta { font-size: 12.5px; color: var(--ink-3); }
.t-hint { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.t-body { font-size: 14px; line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }
.money { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.02em; font-variant-numeric: tabular-nums lining-nums; }
.muted { color: var(--ink-3); }
.soft { color: var(--ink-2); }
.accent-text { color: var(--accent-ink); }
.balance { text-wrap: balance; }
.m-only { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ============================================================
   ОБОЛОЧКА: рейка, шапка, страница, вкладки, FAB
   ============================================================ */
.rail {
  display: flex; flex-direction: column; padding: 22px 14px 18px; gap: 4px; overflow: auto;
}
.rail .wordmark { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; }
.rail .wordmark .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--field); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-size: 17px; }
.rail .wordmark b { font-weight: 500; letter-spacing: 0.14em; font-size: 12.5px; }
.rail .org { padding: 0 10px 18px; }
.rail .org .name { font-size: 13.5px; font-weight: 500; }
.rail .org .plan { font-size: 12px; color: var(--ink-3); }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 12px;
  color: var(--ink-2); font-size: 14px; width: 100%; text-align: left; position: relative;
  transition: background 0.3s var(--ease), color 0.3s var(--ease), transform 0.4s var(--ease);
}
.nav-item svg { width: 19px; height: 19px; flex: none; stroke-width: 1.7; }
.nav-item:hover { background: var(--sunken); color: var(--ink); }
.app[data-theme="dark"] .nav-item:hover { background: rgba(255,255,255,0.05); }
.nav-item.on { background: var(--cell); color: var(--ink); box-shadow: var(--shadow-cell); border: 1px solid var(--cell-line); font-weight: 500; }
.nav-item { border: 1px solid transparent; }
.nav-item .badge { margin-left: auto; }
.rail .group-label { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 18px 11px 6px; }
.rail .rail-foot { margin-top: auto; padding-top: 16px; }
.rail .me { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; width: 100%; text-align: left; }
.rail .me:hover { background: var(--sunken); }
.app[data-theme="dark"] .rail .me:hover { background: rgba(255,255,255,0.05); }
.rail .me .who { font-size: 13.5px; }
.rail .me .role { font-size: 12px; color: var(--ink-3); }

.main { display: grid; grid-template-rows: auto 1fr; min-width: 0; height: 100%; overflow: hidden; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 18px 32px 0; min-height: 56px;
}
.topbar .search {
  flex: 1; max-width: 520px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px;
  border-radius: 999px; background: var(--cell); box-shadow: var(--shadow-cell); color: var(--ink-3); border: 1px solid var(--cell-line);
  cursor: text;
}
.topbar .search svg { width: 18px; height: 18px; flex: none; }
.topbar .search > span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .search kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--ink-3); }
.topbar .spacer { flex: 1; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-2);
  background: var(--cell); box-shadow: var(--shadow-cell); border: 1px solid var(--cell-line); position: relative;
  transition: transform 0.4s var(--ease), color 0.3s;
}
.iconbtn:hover { color: var(--ink); transform: translateY(-1px); }
.iconbtn svg { width: 19px; height: 19px; stroke-width: 1.7; }
.iconbtn .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--cell); }
.iconbtn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.iconbtn.sm { width: 32px; height: 32px; }
.iconbtn.sm svg { width: 16px; height: 16px; }

.page { overflow: auto; padding: 22px 32px 48px; scroll-behavior: smooth; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; letter-spacing: -0.025em; line-height: 1; }
.page-head .sub { margin-top: 8px; color: var(--ink-2); font-size: 14px; }
.page-head .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
.crumbs a:hover { color: var(--ink); }

.tabbar, .fab, .mobile-top { display: none; }

/* ---------- Мобильная оболочка (контейнерный запрос) ---------- */
@container app (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .rail, .topbar { display: none; }
  .mobile-top {
    display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-top) + 10px) 18px 8px;
    position: sticky; top: 0; z-index: 4; background: var(--field);
  }
  .mobile-top .title { font-family: var(--font-display); font-size: 23px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; font-weight: 400; flex: 1; min-width: 0; }
  .mobile-top .title small { display: none; }
  .mobile-top .back { width: 36px; height: 36px; margin-left: -8px; }
  .main { grid-template-rows: auto 1fr; }
  .page { padding: 6px 16px calc(var(--safe-bottom) + 120px); }
  .page-head { display: none; }
  .page-head.keep { display: flex; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 8px 8px calc(var(--safe-bottom) + 8px); background: color-mix(in oklab, var(--cell) 88%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line);
  }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: var(--ink-3); padding: 6px 0 2px; border-radius: 12px; position: relative; }
  .tabbar button svg { width: 22px; height: 22px; stroke-width: 1.6; }
  .tabbar button.on { color: var(--ink); }
  .tabbar button.on::before { content: ""; position: absolute; top: 0; width: 44px; height: 30px; border-radius: 999px; background: var(--cell-rose); z-index: -1; }
  .tabbar button .badge { position: absolute; top: -2px; right: calc(50% - 22px); }
  .tabbar button.create { color: var(--ink-3); }
  .tabbar button.create i { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 999px; background: var(--accent); color: var(--on-accent); margin-top: -18px; box-shadow: 0 12px 24px -10px rgba(214, 79, 127, 0.55); }
  .tabbar button.create i svg { width: 22px; height: 22px; stroke-width: 2.2; }
  .tabbar button.create::before { display: none; }
  .app[data-theme="dark"] .tabbar button.create i { box-shadow: none; }
  .fab { display: none; }
}

/* ============================================================
   ЯЧЕЙКИ И СЕТКИ
   ============================================================ */
.cell {
  background: var(--cell); border-radius: var(--r-card); box-shadow: var(--shadow-cell); border: 1px solid var(--cell-line);
  padding: 20px 22px; min-width: 0;
}
.cell.rose { background: var(--cell-rose); color: var(--rose-ink); box-shadow: none; border-color: transparent; }
.cell.lilac { background: var(--cell-lilac); color: var(--lilac-ink); box-shadow: none; border-color: transparent; }
.cell.ink { background: var(--ink); color: var(--field); box-shadow: none; border-color: transparent; }
.cell.needs .cell-head h2 { color: var(--accent-ink); }
.cell.needs .cell.tight { background: var(--sunken); box-shadow: none; }
.app[data-theme="dark"] .cell.needs .cell.tight { background: var(--field); }
.cell.flush { padding: 0; overflow: hidden; }
.cell.tight { padding: 14px 16px; }
.cell-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.cell-head .titles { min-width: 0; }
.cell-head .link { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.cell-head .link:hover { color: var(--ink); }
.cell.rose .t-meta, .cell.rose .t-hint { color: color-mix(in oklab, var(--rose-ink) 70%, transparent); }
.cell.lilac .t-meta, .cell.lilac .t-hint { color: color-mix(in oklab, var(--lilac-ink) 70%, transparent); }
.cell.ink .t-meta, .cell.ink .t-hint { color: color-mix(in oklab, var(--field) 65%, transparent); }

.grid { display: grid; gap: 12px; }
.grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.c12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-9 { grid-column: span 9; } .span-12 { grid-column: span 12; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; } .mt28 { margin-top: 28px; }
.mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; }

@container app (max-width: 1080px) {
  .grid.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.c12 > * { grid-column: span 12; }
  .grid.c12 > .span-6, .grid.c12 > .span-4, .grid.c12 > .span-3 { grid-column: span 6; }
}
@container app (max-width: 760px) {
  .grid.c2, .grid.c3, .grid.c4 { grid-template-columns: 1fr; }
  .grid.c12 > *, .grid.c12 > .span-6, .grid.c12 > .span-4, .grid.c12 > .span-3 { grid-column: span 12; }
  .grid.c12.keep-halves > .span-6, .grid.c12.keep-halves > .span-3 { grid-column: span 6; }
  .cell { padding: 16px 16px; }
}

/* ============================================================
   КНОПКИ, ЧИПЫ, СТАТУСЫ
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px;
  font-size: 14px; font-weight: 500; white-space: nowrap; border: 1px solid transparent;
  transition: transform 0.45s var(--ease), box-shadow 0.45s var(--ease), background 0.3s, border-color 0.3s;
}
.btn svg { width: 17px; height: 17px; stroke-width: 2; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 22px -12px rgba(214, 79, 127, 0.45); }
.btn.primary:hover { box-shadow: 0 16px 28px -12px rgba(214, 79, 127, 0.55); }
.app[data-theme="dark"] .btn.primary, .app[data-theme="dark"] .btn.primary:hover { box-shadow: none; }
.btn.support { background: var(--support); color: var(--on-support); }
.btn.secondary { background: var(--cell); color: var(--ink); border-color: var(--line-2); }
.btn.secondary:hover { border-color: var(--ink-3); }
.btn.ghost { background: transparent; color: var(--ink-2); }

}

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }

.switch { display: inline-flex; align-items: center; width: 44px; height: 26px; border-radius: 999px; background: var(--line-2); padding: 3px; transition: background 0.3s var(--ease); flex: none; }

.radio-cards { display: grid; gap: 8px; }
.radio-card { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-field); background: var(--sunken); border: 1px solid transparent; text-align: left; width: 100%; }

.radio-card.on { border-color: var(--support); background: var(--cell); }

.radio-card b { display: block; font-weight: 500; font-size: 14px; }

.swatches { display: flex; gap: 8px; flex-wrap: wrap; }

/* ============================================================
   СПИСКИ И ТАБЛИЦЫ
   ============================================================ */
.list { display: flex; flex-direction: column; }
.list-row {
  display: grid; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); text-align: left; width: 100%;
  transition: background 0.25s;
}

.table { width: 100%; border-collapse: collapse; font-size: 14px; }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; font-size: 14px; }

/* ============================================================

.empty { padding: 28px 18px; text-align: center; color: var(--ink-2); }

.toasts { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 24px); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 40; pointer-events: none; }

/* ============================================================

.sheet {
  position: absolute; top: 12px; right: 12px; bottom: auto; max-height: calc(100% - 24px); width: min(520px, calc(100% - 24px)); z-index: 31;
  background: var(--cell); border-radius: var(--r-panel); box-shadow: var(--shadow-float); display: flex; flex-direction: column;

}

.chip .n { opacity: .6; font-weight: 400; margin-left: 2px; }
.chip.first { height: 20px; font-size: 11px; padding: 0 7px; margin-left: 6px; vertical-align: 2px; background: var(--cell-rose); color: var(--rose-ink); }
.grid.top { align-items: start; }
.contact-acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

.pv .svc { gap: 12px; } .pv .svc span:last-child { white-space: nowrap; flex: none; }

.onb > * { min-width: 0; }

.onb-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 28px; }

.agenda-day.today h3 b { color: var(--accent-ink); }

.agenda-rows { display: flex; flex-direction: column; gap: 2px; }
.agenda-row { display: grid; grid-template-columns: 46px auto 1fr; gap: 8px 6px; align-items: center; padding: 8px 8px; border-radius: 10px; text-align: left; width: 100%; font-size: 13.5px; }
.agenda-row:hover { background: var(--hover); }

.agenda-row b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.agenda-row.new b { color: var(--accent-ink); }

.agenda-free { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 8px 0; }

.page-head .actions .btn.ghost { color: var(--ink-3); }
.sheet.wide { width: min(720px, calc(100% - 24px)); }
.sheet.narrow { width: min(440px, calc(100% - 24px)); }
@keyframes sheet-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 12px; }

.sheet-foot { padding: 14px 24px calc(var(--safe-bottom) + 18px); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }

.dialog {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px)); z-index: 32;
  background: var(--cell); border-radius: var(--r-panel); box-shadow: var(--shadow-float); padding: 24px; animation: pop-in 0.45s var(--ease); border: 1px solid var(--cell-line);
}

@container app (max-width: 760px) {
  .sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: calc(100% - var(--safe-top) - 24px); border-radius: 24px 24px 0 0; animation: sheet-up 0.4s var(--ease); }

.menu { position: absolute; z-index: 33; min-width: 240px; background: var(--cell); border-radius: 14px; box-shadow: var(--shadow-float); padding: 6px; animation: pop-menu 0.35s var(--ease); border: 1px solid var(--cell-line); }

/* ============================================================
   ЛИНЕЙКА СУТОК — сигнатурный элемент кабинета
   ============================================================ */
.dayrail { position: relative; height: 54px; margin-top: 6px; }
.dayrail .track { position: absolute; left: 0; right: 0; top: 18px; height: 18px; border-radius: 999px; background: var(--sunken); }
.app[data-theme="dark"] .dayrail .track { background: var(--field); }

.dayrail .seg.free { border: 1.5px dashed var(--accent-ink); background: transparent; }
.dayrail .seg.block { background: repeating-linear-gradient(135deg, var(--line-2) 0 3px, transparent 3px 7px); }
.dayrail .seg.tone-m1 { --ev: var(--m1); } .dayrail .seg.tone-m2 { --ev: var(--m2); } .dayrail .seg.tone-m3 { --ev: var(--m3); } .dayrail .seg.tone-m4 { --ev: var(--m4); } .dayrail .seg.tone-m5 { --ev: var(--m5); } .dayrail .seg.tone-m6 { --ev: var(--m6); }
.dayrail .seg.busy[class*="tone-"], .dayrail .seg.busy.done[class*="tone-"] { background: var(--ev); }
.dayrail .seg.busy.done[class*="tone-"] { opacity: .4; }
.rail-legend i.tone-m1 { background: var(--m1); } .rail-legend i.tone-m2 { background: var(--m2); } .rail-legend i.tone-m3 { background: var(--m3); } .rail-legend i.tone-m4 { background: var(--m4); } .rail-legend i.tone-m5 { background: var(--m5); } .rail-legend i.tone-m6 { background: var(--m6); }
.dayrail .now { position: absolute; top: 8px; bottom: 6px; width: 2px; background: var(--ink); border-radius: 2px; }
.dayrail .now::after { content: attr(data-t); position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }

.rail-legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); margin-top: 6px; flex-wrap: wrap; }
.rail-legend i { display: inline-block; width: 18px; height: 8px; border-radius: 999px; vertical-align: middle; margin-right: 6px; }
.rail-legend i.busy { background: var(--accent); } .rail-legend i.free { border: 1.5px dashed var(--accent-ink); height: 6px; } .rail-legend i.block { background: repeating-linear-gradient(135deg, var(--line-2) 0 3px, transparent 3px 6px); }

/* ---------- Визиты в списках ---------- */

.visit .t { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 500; line-height: 1.1; }
.visit .t small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }
.visit .who { min-width: 0; }
.visit .who b { display: block; font-weight: 500; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.gap-row { display: flex; align-items: center; gap: 12px; padding: 8px 0 8px 0; color: var(--ink-3); font-size: 13px; }

/* ---------- Сводки ---------- */

.cell.lilac .stat .k, .cell.lilac .stat .d, .cell.rose .stat .k, .cell.rose .stat .d { color: inherit; opacity: 0.7; }
.stat.big .v { font-size: 52px; }

.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }

.cell.lilac .heat i { background: var(--lilac-ink); }

.cell.lilac .spark polyline { stroke: var(--lilac-ink); } .cell.lilac .spark circle { fill: var(--lilac-ink); }
.cell.lilac .heat-cap { color: color-mix(in oklab, var(--lilac-ink) 70%, transparent); }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13.5px; }
.hbar .track { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--support); border-radius: 999px; }
.hbar .val { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.spark { width: 100%; height: 40px; }

/* ============================================================
   КАЛЕНДАРЬ
   ============================================================ */
.cal-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.cal-toolbar .date { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.02em; min-width: 200px; }
.cal-toolbar .date small { font-family: var(--font-ui); font-size: 12.5px; color: var(--ink-3); margin-left: 8px; }
.daystrip { display: none; }
.cal { display: grid; grid-template-columns: 52px 1fr; position: relative; }
.cal > div:first-child { grid-column: 1; grid-row: 1; }
.cal .hours { grid-column: 1; grid-row: 2; display: grid; grid-auto-rows: var(--h, 64px); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cal .hours div { transform: translateY(-7px); }
.cal .cols { grid-column: 2; grid-row: 2; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; position: relative; }
.cal .col { position: relative; background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--h, 64px)); border-radius: 10px; min-height: calc(var(--h, 64px) * var(--n, 12)); }
.cal .col-head { position: sticky; top: 0; z-index: 3; }
.cal .heads { grid-row: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 8px; grid-column: 2; }
.cal .head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; font-size: 13px; }

.cal .head b { font-weight: 500; } .cal .head small { color: var(--ink-3); }
.cal .head .load { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ev { position: absolute; left: 4px; right: 4px; border-radius: 10px; padding: 7px 10px; font-size: 12.5px; line-height: 1.3; overflow: hidden; cursor: pointer; text-align: left; transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease); }
.ev:hover { transform: translateY(-1px); box-shadow: var(--shadow-cell); z-index: 2; }
.ev b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev span { display: block; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .t { font-variant-numeric: tabular-nums; }
.ev.busy { --ev: var(--accent); --ev-soft: var(--cell-rose); --ev-ink: var(--rose-ink); background: var(--ev-soft); color: var(--ev-ink); }
.ev.busy.tone-m1 { --ev: var(--m1); --ev-soft: var(--m1-soft); --ev-ink: var(--m1-ink); }
.ev.busy.tone-m2 { --ev: var(--m2); --ev-soft: var(--m2-soft); --ev-ink: var(--m2-ink); }
.ev.busy.tone-m3 { --ev: var(--m3); --ev-soft: var(--m3-soft); --ev-ink: var(--m3-ink); }
.ev.busy.tone-m4 { --ev: var(--m4); --ev-soft: var(--m4-soft); --ev-ink: var(--m4-ink); }
.ev.busy.tone-m5 { --ev: var(--m5); --ev-soft: var(--m5-soft); --ev-ink: var(--m5-ink); }
.ev.busy.tone-m6 { --ev: var(--m6); --ev-soft: var(--m6-soft); --ev-ink: var(--m6-ink); }
.ev.busy.pending { background: transparent; border: 1.5px dashed var(--ev); }
.ev.busy.done { opacity: .5; }
.ev.busy.current { box-shadow: inset 0 0 0 1.5px var(--ev); }
.ev.free { border: 1.5px dashed var(--accent-ink); color: var(--accent-ink); background: transparent; display: flex; align-items: center; justify-content: center; font-weight: 500; }
.ev.free:hover { background: var(--cell-rose); }
.ev.free.hidden { border-color: var(--line-2); color: var(--ink-3); }
.ev.block { background: repeating-linear-gradient(135deg, var(--sunken) 0 6px, transparent 6px 12px); color: var(--ink-3); border: 1px solid var(--line); }
.now-line { position: absolute; left: 0; right: 0; height: 1.5px; background: var(--ink); opacity: .55; z-index: 0; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.ev { z-index: 1; }
.cal .hours .is-now, .wk-body .hours .is-now { color: var(--ink); font-weight: 600; }
.week { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); gap: 6px; }

.week .wh.today::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); }
.agenda-day { padding: 14px 0; border-top: 1px solid var(--line); }

.agenda-day h3 b { color: var(--ink); font-weight: 500; }

@container app (max-width: 760px) {
  .cal-toolbar .date { display: none; }
  .daystrip { display: flex; gap: 6px; overflow: auto; scrollbar-width: none; margin: 0 -16px 12px; padding: 4px 16px; }
  .daystrip::-webkit-scrollbar { display: none; }
  .daystrip button { flex: none; width: 46px; height: 62px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--ink-3); background: var(--cell); box-shadow: var(--shadow-cell); }
  .daystrip button b { font-size: 16px; color: var(--ink); font-weight: 500; }
  .daystrip button.on { background: var(--ink); color: var(--field); } .daystrip button.on b { color: var(--field); }
  .daystrip button i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .cal { grid-template-columns: 44px 1fr; overflow-x: auto; }
  .cal .heads { gap: 4px; grid-auto-columns: minmax(150px, 1fr); position: sticky; top: 0; z-index: 3; background: var(--cell); padding-bottom: 4px; margin-bottom: 4px; }

  .seg button { flex: none; }
  .chip.wrap { height: auto; min-height: 30px; padding: 5px 12px; white-space: normal; }

}

/* ============================================================
   РЕСЕПШЕН
   ============================================================ */
.desk-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; align-items: start; }
@container app (max-width: 900px) { .desk-grid { grid-template-columns: 1fr; } }
.chair { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: var(--sunken); }
.chair.tone-m1 { --ev: var(--m1); } .chair.tone-m2 { --ev: var(--m2); } .chair.tone-m3 { --ev: var(--m3); } .chair.tone-m4 { --ev: var(--m4); } .chair.tone-m5 { --ev: var(--m5); } .chair.tone-m6 { --ev: var(--m6); }
.member-card.tone-m1 { --ev: var(--m1); } .member-card.tone-m2 { --ev: var(--m2); } .member-card.tone-m3 { --ev: var(--m3); } .member-card.tone-m4 { --ev: var(--m4); } .member-card.tone-m5 { --ev: var(--m5); } .member-card.tone-m6 { --ev: var(--m6); }
.member-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ev, var(--line-2)); margin-right: 6px; vertical-align: 1px; }

/* ============================================================
   УСЛУГИ

.cat-head { display: flex; align-items: center; gap: 10px; padding: 18px 0 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }

/* ============================================================
   КОМАНДА

/* ============================================================

   ============================================================ */

.pv { padding: 22px 18px; font-family: var(--font-ui); }
.pv .hero { display: flex; align-items: center; gap: 12px; }
.pv .hero .ph { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #e8c3d0, #c9a6d8); }
.pv .hero b { display: block; font-size: 17px; font-weight: 500; }
.pv .hero small { color: #7a6f73; font-size: 12px; }
.pv h4 { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #8a7f83; margin: 22px 0 8px; font-weight: 500; }
.pv .svc { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid rgba(0,0,0,0.07); font-size: 13px; }

.pv .slots { display: flex; gap: 6px; flex-wrap: wrap; }

.link-box { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 999px; background: var(--sunken); font-size: 14px; font-variant-numeric: tabular-nums; }
.app[data-theme="dark"] .link-box { background: var(--field); }
.link-box b { font-weight: 500; }
.link-box .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qr { width: 96px; height: 96px; border-radius: 12px; background: var(--cell); display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; padding: 8px; border: 1px solid var(--line); }
.qr i { background: var(--ink); border-radius: 1px; }
.qr i.o { background: transparent; }
.world { border-radius: 14px; padding: 0; overflow: hidden; border: 2px solid transparent; text-align: left; width: 100%; background: var(--cell); box-shadow: var(--shadow-cell); transition: transform 0.4s var(--ease); }
.world:hover { transform: translateY(-2px); }
.world.on { border-color: var(--support); }
.world .art { height: 92px; display: flex; align-items: flex-end; padding: 10px; font-size: 12px; }

/* ============================================================
   СТУДИЯ
   ============================================================ */
.studio { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; background: var(--field); z-index: 8; }
.studio-bar { display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-top) + 12px) 16px 12px; border-bottom: 1px solid var(--line); background: var(--cell); }
.studio-bar .status { margin-left: 4px; }

.studio-body { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
.studio-canvas { display: grid; place-items: center; padding: 24px; overflow: auto; }
.studio-canvas .preview-frame { max-height: none; }
.studio-side { background: var(--cell); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; }
.studio-side .ctx { display: flex; gap: 4px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.acc { border-bottom: 1px solid var(--line); }
.acc > button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 16px; font-size: 14px; font-weight: 500; text-align: left; }
.acc > button span { font-weight: 400; color: var(--ink-3); font-size: 12.5px; margin-left: 8px; }
.acc > button svg { width: 16px; height: 16px; color: var(--ink-3); transition: transform 0.35s var(--ease); }

.acc .body { padding: 0 16px 16px; display: none; flex-direction: column; gap: 12px; }

@container app (max-width: 900px) {
  .studio-body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }

.onb-step i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 500; border: 1.5px solid var(--line-2); color: var(--ink-3); }
.onb-step.done i { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

@container app (max-width: 860px) { .onb { grid-template-columns: 1fr; } }

/* ============================================================

.palette { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); z-index: 32; background: var(--cell); border-radius: 20px; box-shadow: var(--shadow-float); overflow: hidden; animation: pop-menu 0.35s var(--ease); border: 1px solid var(--cell-line); }

.palette .in input { flex: 1; background: none; border: 0; font-size: 17px; outline: none; }
.palette .in svg { width: 20px; height: 20px; color: var(--ink-3); }
.palette .res { max-height: 420px; overflow: auto; padding: 8px; }
.palette .grp { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px 4px; }
.palette .it { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 10px; text-align: left; font-size: 14px; }
.palette .it:hover, .palette .it.on { background: var(--hover); }

/* ============================================================
   АДМИН-ПАНЕЛЬ

.funnel { display: flex; flex-direction: column; gap: 8px; }

/* ============================================================
   АУТЕНТИФИКАЦИЯ / ПУСТЫЕ СТРАНИЦЫ

/* ============================================================

   ============================================================ */

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* scrollbars */
.page::-webkit-scrollbar, .sheet-body::-webkit-scrollbar, .studio-side::-webkit-scrollbar { width: 8px; }
.page::-webkit-scrollbar-thumb, .sheet-body::-webkit-scrollbar-thumb, .studio-side::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }

/* ============================================================
   КАЛЕНДАРЬ v2 — неделя, дорожки команды, сводка
   ============================================================ */
.cal-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.cal-summary .cs { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-radius: 14px; background: var(--cell); box-shadow: var(--shadow-cell); border: 1px solid var(--cell-line); }
.cal-summary .cs span { font-size: 12px; color: var(--ink-3); }
.cal-summary .cs b { font-size: 22px; font-weight: 400; line-height: 1; }
.cal-summary .cs.rose { background: var(--cell-rose); color: var(--rose-ink); box-shadow: none; } .cal-summary .cs.rose span { color: inherit; opacity: .7; }
.cal-summary .cs.lilac { background: var(--cell-lilac); color: var(--lilac-ink); box-shadow: none; } .cal-summary .cs.lilac span { color: inherit; opacity: .7; }
@container app (max-width: 760px) { .cal-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cal-summary .cs { padding: 10px 12px; } .cal-summary .cs b { font-size: 19px; } }

.cal-wrap { padding: 16px 16px 20px; }
.cal .head { align-items: center; flex-wrap: wrap; }
.cal .head .txt { min-width: 0; flex: 1; }
.cal .head .txt b, .cal .head .txt small { display: block; }
.cal .head .txt small { font-size: 11.5px; color: var(--ink-3); }
.cal .head .loadbar { flex-basis: 100%; height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 4px; }
.cal .head .loadbar i { display: block; height: 100%; background: var(--ev, var(--accent)); border-radius: 999px; }
.cal .head.tone-m1 { --ev: var(--m1); } .cal .head.tone-m2 { --ev: var(--m2); } .cal .head.tone-m3 { --ev: var(--m3); } .cal .head.tone-m4 { --ev: var(--m4); } .cal .head.tone-m5 { --ev: var(--m5); } .cal .head.tone-m6 { --ev: var(--m6); }
.cal .head.today .loadbar { background: rgba(0,0,0,0.06); }
.cal .hours div { padding-right: 8px; text-align: right; }
.ev.compact { padding: 1px 8px; font-size: 11px; line-height: 1.25; border-radius: 6px; }
.ev.compact b { font-size: 11px; }
.ev.compact b::before { width: 5px; height: 5px; }
.ev.busy b::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--svc, var(--ev)); margin-right: 5px; vertical-align: 1px; }
.ev.busy[class*="tone-"] b::before { background: var(--ev); }
.ev.busy.pending b::before { background: var(--ev); }
.ev.busy.noshow { background: var(--danger-soft); color: var(--danger); text-decoration: line-through; }
.ev .pulse { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--ev, var(--accent)); box-shadow: 0 0 0 0 rgba(226,86,138,.5); animation: pulse 1.8s var(--ease) infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(214,79,127,.3); } 70% { box-shadow: 0 0 0 6px rgba(214,79,127,0); } 100% { box-shadow: 0 0 0 0 rgba(214,79,127,0); } }
.ev.free svg { width: 12px; height: 12px; margin-right: 4px; }
.ev.block.full { top: 4px; bottom: 4px; height: auto; display: grid; place-items: center; }

.wk-wrap { padding: 12px 16px 18px; }
.wk-legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--ink-2); padding: 4px 4px 12px; }
.wk-legend i.lane { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
.wk { --cols: 52px repeat(7, minmax(0, 1fr)); }
.wk-head { display: grid; grid-template-columns: var(--cols); gap: 6px; margin-bottom: 8px; position: sticky; top: -22px; z-index: 3; background: var(--cell); padding-top: 4px; }
.wk-corner { display: flex; align-items: flex-end; justify-content: flex-end; font-size: 11px; color: var(--ink-3); padding: 0 8px 10px 0; }
.wk-dh { padding: 8px 10px 10px; border-radius: 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.wk-dh .dn { display: flex; align-items: baseline; gap: 6px; }
.wk-dh .dn span { font-size: 12px; color: var(--ink-3); text-transform: lowercase; }
.wk-dh .dn b { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
.wk-dh .dm { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-dh .dm.money { font-family: var(--font-display); font-size: 14px; color: var(--ink-2); }
.wk-dh.today { background: var(--cell-rose); color: var(--rose-ink); }
.wk-dh.today .dn span, .wk-dh.today .dm { color: inherit; opacity: .75; }
.wk-dh.past { opacity: .6; }
.wk-body { display: grid; grid-template-columns: var(--cols); gap: 6px; }
.wk-body .hours { display: grid; grid-auto-rows: var(--h); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.wk-body .hours div { transform: translateY(-7px); text-align: right; padding-right: 8px; }
.wk-col { position: relative; min-height: calc(var(--h) * var(--n)); border-radius: 10px; background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--h)); }
.wk-col.today { background-color: color-mix(in oklab, var(--cell-rose) 22%, transparent); }
.wk-col.past .ev.busy { opacity: .55; }
.wk-col .ev { padding: 5px 7px; font-size: 11.5px; border-radius: 8px; }
.wk-col .ev b { font-size: 11.5px; white-space: normal; overflow: hidden; line-height: 1.2; }
.wk-col .ev span { white-space: normal; overflow: hidden; }
.wk-col .ev.free { font-size: 11px; }
.ev.lane { padding: 0; border-radius: 6px; border-left: 0; min-width: 0; }
.ev.lane.busy { background: var(--ev); }
.ev.lane.busy.pending { background: transparent; border: 1.5px dashed var(--ev); }
.ev.lane.busy.done { opacity: .45; }
.ev.lane.free { border-width: 1px; }
.ev.lane.block { border-radius: 6px; }
i.lane.m1 { background: var(--m1); } i.lane.m2 { background: var(--m2); } i.lane.m3 { background: var(--m3); } i.lane.m4 { background: var(--m4); } i.lane.m5 { background: var(--m5); } i.lane.m6 { background: var(--m6); }
.wk-col .now-line span { left: 4px; top: -18px; }
@container app (max-width: 900px) {
  .wk-wrap { overflow-x: auto; }
  .wk { --cols: 44px repeat(7, 132px); min-width: calc(44px + 7 * 138px); }
  .wk-head { top: 0; }
  .wk-dh .dm.money { display: none; }
  .wk-corner span { display: none; }
  .wk-legend .muted { display: none; }
}

/* ============================================================
   ПОЛИРОВКА — микровзаимодействия, часы, статус-бар, герои
   ============================================================ */
.btn:active { transform: translateY(0) scale(0.98); }

.nav-item.on svg { color: var(--accent-ink); }

.hero-next { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--sunken); margin-top: 16px; }

.quick-actions { display: none; }

.member-card .mini-rail { grid-column: 1 / -1; }

.member-card .mini { position: relative; height: 10px; border-radius: 999px; background: var(--sunken); margin-top: 4px; overflow: hidden; }
.app[data-theme="dark"] .member-card .mini { background: var(--field); }
.member-card .mini i { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: var(--ev, var(--accent)); }
.member-card .mini i.done { opacity: .4; }
.member-card .mini i.free { background: transparent; border: 1px dashed var(--accent-ink); }

.desk-clock { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.desk-clock b { font-family: var(--font-display); font-size: 44px; font-weight: 300; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.desk-clock span { color: var(--ink-3); font-size: 13px; }
.ring { width: 44px; height: 44px; border-radius: 50%; background: conic-gradient(var(--ev, var(--support-strong)) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
.ring i { width: 34px; height: 34px; border-radius: 50%; background: var(--sunken); display: grid; place-items: center; font-size: 10.5px; font-weight: 500; font-variant-numeric: tabular-nums; font-style: normal; }

.heat { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 3px; height: 44px; align-items: end; }

.statusbar, .home-ind { display: none; }
.stage[data-device="phone"] .statusbar { display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 16px 30px 0; font-size: 14px; font-weight: 600; z-index: 6; pointer-events: none; font-variant-numeric: tabular-nums; }

.stat .v { transition: color .3s; }
.kpi-spark { margin-top: 10px; opacity: .8; }
.sheet-head .avatar { margin-top: 2px; }
.list-row.click, .visit.click, .member-card, .world, .req { transition: background 0.25s, transform 0.45s var(--ease), box-shadow 0.45s var(--ease); }
.visit.click:active, .list-row.click:active { transform: scale(0.995); }

.tag-new::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(214,79,127,.3); animation: pulse 1.8s var(--ease) infinite; }

  .visit { grid-template-columns: 54px 1fr; gap: 4px 10px; padding: 10px 0; }

  .visit .t { font-size: 14px; grid-row: 1 / span 2; align-self: start; }
  .visit .acts { grid-column: 2; justify-content: flex-start; }
  .visit .acts:empty { display: none; }
  .visit .who b { font-size: 14px; }
  .visit .acts { gap: 4px; }
  .visit .acts .btn.xs { padding: 0 9px; }
  .status { height: 22px; font-size: 11.5px; }
  .desk-clock b { font-size: 32px; }
  .chair { padding: 10px 12px; gap: 8px 10px; grid-template-columns: auto 1fr; }
  .chair .acts { grid-column: 1 / -1; justify-content: flex-end; }
  .chair > div:last-child:empty { display: none; }
  .desk-clock .now b { font-size: 32px; } .desk-clock .now span { font-size: 12.5px; }
  .page-preview { display: none; }
  .contact-acts .btn span { font-size: 12.5px; }
  .table.responsive td.m-acts { grid-column: 1 / -1; grid-row: 3; text-align: left; margin-top: 6px; }
  .table.responsive td.m-acts .row { justify-content: flex-start !important; }
  .table.responsive td.m-status { grid-column: 1; grid-row: 2; }
  .table.responsive td.r { white-space: nowrap; }
  .studio-side .studio-grip { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 16px 10px; text-align: left; border-bottom: 1px solid var(--line); position: relative; }
  .studio-grip .handle { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; border-radius: 999px; background: var(--line-2); }
  .studio-grip b { font-weight: 500; font-size: 14px; margin-top: 6px; }
  .studio-grip .t-meta { margin-top: 6px; }
  .studio-grip svg { width: 16px; height: 16px; margin-left: auto; margin-top: 6px; color: var(--ink-3); transition: transform .35s var(--ease); }
  .studio-body { position: relative; display: block; }
  .studio-canvas { height: 100%; padding: 12px 12px 64px; }
  .studio-side { position: absolute; left: 0; right: 0; bottom: 0; max-height: 52px; overflow: hidden; transition: max-height .45s var(--ease); box-shadow: var(--shadow-float); z-index: 3; }
  .studio-body.panel-open .studio-side { max-height: 74%; overflow: auto; }
  .studio-body.panel-open .studio-grip svg { transform: rotate(180deg); }
  .studio-canvas { padding: 12px; }
  .studio-canvas .preview-frame { max-width: 100%; max-height: 100%; }
  .studio-bar { padding: calc(var(--safe-top) + 8px) 12px 8px; }
  .studio-bar .btn.sm { height: 32px; padding: 0 10px; }
  .onb-panel { padding: 18px 16px; min-height: 0; }
  .onb-acts { flex-direction: column-reverse; align-items: stretch; }
  .onb-acts .grow { display: none; }
  .onb-acts .btn { width: 100%; height: 46px; }
  .onb-steps { flex-direction: row; overflow: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; gap: 6px; }
  .onb-step { flex: none; width: auto; grid-template-columns: 24px auto; padding: 8px 10px 8px 8px; align-items: center; background: var(--cell); box-shadow: var(--shadow-cell); }
  .onb-step:not(.on) b { display: none; }
  .onb-step span { display: none; }
  .onb-step i { width: 24px; height: 24px; font-size: 11px; }

  .worlds.grid.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ring { width: 36px; height: 36px; } .ring i { width: 28px; height: 28px; font-size: 9.5px; }
  .svc-row { grid-template-columns: 5px 1fr auto auto; gap: 10px; padding: 9px 0; }
  .svc-row .bar { height: 28px; }
  .svc-row b { font-size: 14px; }
  .svc-row small { font-size: 12px; }
  .svc-row .price { font-size: 14px; }
  .cat-head { padding: 12px 0 4px; }
  .member-card { padding: 12px; gap: 10px; }
  .member-card .avatar.lg { width: 44px; height: 44px; font-size: 15px; }
  .member-card b { font-size: 14px; }
  .member-card .load b { font-size: 16px; }

/* ============================================================
   ПРАВКИ ПО ОТЧЁТУ ЖЮРИ — v3
   ============================================================ */

/* Тёмная («чернильная») поверхность: всё внутри читается */
.cell.lilac .kv dt, .cell.lilac .bars .bar span, .cell.lilac .bars-scale, .cell.lilac .heat-cap, .cell.lilac .muted, .cell.lilac .sub-line { color: color-mix(in oklab, var(--lilac-ink) 62%, transparent); }
.cell.lilac .kv dd, .cell.lilac .main-line { color: var(--lilac-ink); }
.cell.lilac .bars .bar b { color: color-mix(in oklab, var(--lilac-ink) 75%, transparent); }
.cell.lilac .bars .bar i { background: color-mix(in oklab, var(--lilac-ink) 42%, transparent); opacity: 1; }
.cell.lilac .bars .bar.on i, .cell.lilac .bars .bar:hover i { background: var(--lilac-ink); }
.cell.lilac .heat i { background: color-mix(in oklab, var(--lilac-ink) 45%, transparent); opacity: 1; }
.cell.lilac .heat i.on { background: var(--lilac-ink); }
.cell.lilac .heat i.off { background: color-mix(in oklab, var(--lilac-ink) 18%, transparent); }
.cell.lilac .spark polyline { stroke: var(--lilac-ink); opacity: .8; } .cell.lilac .spark circle { fill: var(--lilac-ink); }
.cell.lilac .list-row { border-color: color-mix(in oklab, var(--lilac-ink) 16%, transparent); }
.cell.lilac .status { background: color-mix(in oklab, var(--lilac-ink) 16%, transparent); color: var(--lilac-ink); }

/* Столбцы говорят числами: подпись значения и шкала */
.bars-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
.bars-scale { display: flex; flex-direction: column; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-bottom: 18px; white-space: nowrap; }
.bars .bar b { font-size: 10px; font-weight: 500; color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .25s; white-space: nowrap; }
.bars .bar.on b, .bars .bar:hover b { opacity: 1; }

/* Статусы: розовый остаётся только за действием */
.status.wait { background: var(--warn-soft); color: var(--warn); }
.status.done { background: var(--sunken); color: var(--ink-2); }
.status.done::before { display: none; }
.status.fav { background: var(--sunken); color: var(--accent-ink); }
.app[data-theme="dark"] .status.done, .app[data-theme="dark"] .status.fav { background: var(--field); }

/* Пометки в строках — по ширине текста, а не во всю строку */
.tag-first, .tag-dup { display: inline-flex; align-items: center; height: 19px; padding: 0 8px; margin-left: 6px; border-radius: 999px; font-size: 11px; font-weight: 500; vertical-align: 1px; white-space: nowrap; }
.tag-first { background: var(--cell-rose); color: var(--rose-ink); }
.tag-dup { background: var(--warn-soft); color: var(--warn); }
.visit .who > b { display: block; font-weight: 500; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.visit .who > span.sub { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Мобильная подстрока не выводится в табличной раскладке */
.table .cellname small.m-only, .table td small.m-only { display: none; }
.table .cellname small.hide-m { display: block; color: var(--ink-3); font-size: 12px; }

/* События календаря: читаемы, не наползают, не режут текст */
.ev { min-height: 20px; }
.ev.compact { padding: 2px 8px; display: flex; align-items: center; }
.ev.busy.done { opacity: 1; background: var(--sunken); color: var(--ink-2); }
.ev.busy.done b::before { background: var(--line-2); }
.app[data-theme="dark"] .ev.busy.done { background: var(--field); }
/* В неделе прошедшее сохраняет цвет мастера: приглушён только заголовок дня */
.wk-col .ev.busy.done, .wk-col.past .ev.busy { opacity: 1; background: var(--ev-soft); color: var(--ev-ink); }
.wk-col .ev.busy.done b::before, .wk-col.past .ev.busy b::before { background: var(--ev); opacity: .5; }
.ev.block { background: var(--sunken); border: 1px solid var(--line); color: var(--ink-3); }
.ev.block::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: repeating-linear-gradient(135deg, var(--line-2) 0 3px, transparent 3px 6px); }
.ev.block b { position: relative; padding-left: 8px; }
.app[data-theme="dark"] .ev.block { background: var(--field); }
.cal .hours, .wk-body .hours { position: sticky; left: 0; z-index: 4; background: var(--cell); }
.cal .heads { background: var(--cell); }

/* Шторки: якорь по вертикали, тень у подвала, итог в подвале */
@container app (min-width: 761px) {
  .sheet { top: 50%; transform: translateY(-50%); max-height: calc(100% - 24px); }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(-50%) translateX(24px); } to { opacity: 1; transform: translateY(-50%); } }
}
.sheet-foot { box-shadow: 0 -10px 18px -14px rgba(31, 26, 28, .35); }
.sheet-foot .grow.total { display: flex; align-items: baseline; gap: 6px; justify-content: center; }
.sheet-foot .grow.total .money { font-size: 19px; }
.danger-zone { border: 1px solid var(--danger-soft); border-radius: var(--r-field); padding: 12px 14px; gap: 8px; }
.danger-zone > h3 { color: var(--danger); }
.btn.ghost-danger { background: transparent; color: var(--danger); }
.btn.ghost-danger:hover { background: var(--danger-soft); transform: none; }
.error-inline { color: var(--danger); text-transform: none; letter-spacing: 0; }

/* Перенос записи: два состояния в одну строку без распорок */
.move-pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.move-pair > div { min-width: 0; padding: 12px 14px; border-radius: var(--r-field); background: var(--sunken); }
.app[data-theme="dark"] .move-pair > div { background: var(--field); }
.move-pair .to { background: var(--cell-rose); color: var(--rose-ink); }
.move-pair .to .t-meta { color: inherit; opacity: .75; }
.move-pair b { display: block; margin-top: 4px; font-size: 15px; font-weight: 500; }
.move-pair .arrow { display: grid; place-items: center; color: var(--ink-3); }
.move-pair .arrow svg { width: 18px; height: 18px; }
@container app (max-width: 460px) {
  .move-pair { grid-template-columns: 1fr; }
  .move-pair .arrow { transform: rotate(90deg); height: 18px; }
}

/* Сегменты по содержимому, а не во всю карточку */
.field > .seg, .field .seg:not(.block) { align-self: flex-start; max-width: 100%; }

/* Поиск на телефоне — свой экран, без клавиатурных подсказок */
@container app (max-width: 760px) {
  .palette { top: 0; left: 0; right: 0; bottom: 0; width: auto; border-radius: 0; display: flex; flex-direction: column; padding-top: var(--safe-top); }
  .palette .res { max-height: none; flex: 1; padding-bottom: calc(var(--safe-bottom) + 12px); }
  .palette .foot { display: none; }
  .palette .it { flex-wrap: wrap; }
  .palette .it .k { display: none; }
  .palette .it .t-meta { flex-basis: 100%; margin-left: 40px; }
}
.palette .res { padding-bottom: 12px; }

/* Меню не вылезает за пределы экрана */
.menu { max-height: 320px; overflow: auto; }
.dialog.sheet-like { padding: 0 0 calc(var(--safe-bottom) + 10px); }
.dialog.sheet-like .handle { display: block; width: 36px; height: 4px; border-radius: 999px; background: var(--line-2); margin: 10px auto 0; }
.dialog.sheet-like .sheet-head { padding: 10px 16px 6px; }
.dialog.sheet-like .sheet-head h2 { font-size: 20px; }
.dialog.sheet-like .menu { padding: 0 8px; max-height: 60vh; }

/* Действия экрана не пропадают на телефоне */
.mobile-actions { display: none; }
@container app (max-width: 760px) {
  .mobile-actions { display: flex; gap: 6px; overflow: auto; scrollbar-width: none; padding: 2px 16px 10px; }
  .mobile-actions::-webkit-scrollbar { display: none; }
  .mobile-actions .btn { flex: none; height: 34px; padding: 0 13px; font-size: 13px; }
  .mobile-actions .seg { flex: none; }
}

/* Ленты фильтров: одно поведение и мягкий край */
.chips.scroll { mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 24px), transparent 100%); }

/* Онбординг — отдельный слой */
.onb-shell { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--field); z-index: 8; }
.onb-bar { display: flex; align-items: center; gap: 12px; padding: calc(var(--safe-top) + 12px) 20px 12px; border-bottom: 1px solid var(--line); background: var(--cell); }
.onb-bar .ttl { font-family: var(--font-display); font-size: 19px; letter-spacing: -0.02em; }
.onb-bar .spacer { flex: 1; }
.onb { padding: 24px 28px 32px; overflow: auto; }
.onb-aside { min-width: 0; }
@container app (max-width: 760px) {
  .onb { padding: 12px 16px calc(var(--safe-bottom) + 20px); }
  .onb-bar { padding: calc(var(--safe-top) + 10px) 14px 10px; }
  .onb-bar .ttl { font-size: 16px; }
  .onb-bar .t-meta { white-space: nowrap; }
}

/* Фильтры админки складываются на телефоне */
.filters-toggle { display: none; }
.filters-list { display: contents; }
@container app (max-width: 760px) {
  .filters-toggle { display: inline-flex; }
  .filters-list { display: none; flex-basis: 100%; gap: 8px; flex-wrap: wrap; }
  .filters-list.open { display: flex; }
  .filters-list .select { width: 100%; }
}

/* Полосы загрузки знают цвет человека */
.hbar.tone-m1 .track i { background: var(--m1); } .hbar.tone-m2 .track i { background: var(--m2); }
.hbar.tone-m3 .track i { background: var(--m3); } .hbar.tone-m4 .track i { background: var(--m4); }
.hbar.tone-m5 .track i { background: var(--m5); } .hbar.tone-m6 .track i { background: var(--m6); }

/* Логи: важность точкой на телефоне */
@container app (max-width: 760px) {
  .log-row { grid-template-columns: 8px 60px 1fr; align-items: start; }
  .log-row::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); margin-top: 6px; }
  .log-row.warn::before { background: var(--warn); }
}

/* Карточка профиля не оставляет пустую половину экрана */
@container app (min-width: 1081px) {
  .grid.top > .cell.span-4:first-child { position: sticky; top: 0; }
}

/* Предпросмотр страницы: цена не переносится */
.pv .svc .num { white-space: nowrap; }

/* Появление экрана — коротко и одинаково */
.page > * { animation: rise 0.26s var(--ease) both; }

/* Затемнение под любым модальным слоем — одно и заметное */
.overlay { background: color-mix(in oklab, var(--ink) 46%, transparent); }
.app[data-theme="dark"] .overlay { background: rgba(0, 0, 0, 0.66); }

/* Оболочка терпит любое число рядов: шапка, действия, страница */
.main { display: flex; flex-direction: column; }
.main > .page { flex: 1 1 auto; min-height: 0; }
.main > .topbar, .main > .mobile-top, .main > .mobile-actions { flex: none; }

/* Пометка в строке визита остаётся пометкой, а не полосой */
.visit .who .tag-first, .visit .who .tag-dup, .list-row .tag-first, .list-row .tag-dup { display: inline-flex; width: auto; }

/* Подвал шторки на телефоне: отмена слева, главное действие во всю ширину снизу */
@container app (max-width: 760px) {
  .sheet-foot { flex-wrap: wrap; }
  .sheet-foot .grow { order: 2; }
  .sheet-foot .btn.ghost { order: 1; }
  .sheet-foot .btn.secondary { order: 2; }
  .sheet-foot .btn.primary, .sheet-foot .btn.danger { order: 3; flex: 1 1 100%; }
}

/* Иконка в пустом состоянии не распирает блок */
.empty svg { width: 22px; height: 22px; color: var(--ink-3); margin-bottom: 6px; }
.empty.ring p { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; }

/* Приглашение в команде: действия переносятся на свою строку */
.invite-row { grid-template-columns: auto 1fr auto; }
.invite-row .row { flex-wrap: wrap; }
@container app (max-width: 700px) {
  .invite-row { grid-template-columns: auto 1fr; }
  .invite-row .row { grid-column: 1 / -1; justify-content: flex-start; }
}

/* Столбцы на телефоне: без подписи значения, чтобы ряд не распирал экран */
@container app (max-width: 760px) {
  .bars .bar b { display: none; }
  .bars-wrap { gap: 8px; }
  .bars-scale { font-size: 10px; }
}

/* Ячейки сетки не распирают строку длинным текстом */
.list-row > *, .visit > *, .chair > *, .svc-row > *, .log-row > *, .health-row > *, .funnel .f > * { min-width: 0; }
.list-row .main-line, .list-row .sub-line, .log-row .obj, .log-row .what { overflow-wrap: anywhere; }


/* ============================================================
   ПРАВКИ ПО ТРЕТЬЕМУ ОТЧЁТУ ЖЮРИ — v4
   ============================================================ */

/* Один вид у всех выпадающих полей: свой шеврон вместо системного треугольника */
.select {
  background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231F1A1C' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' opacity='.48'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-position: right 12px center; background-size: 16px 16px; background-repeat: no-repeat; padding-right: 38px;
}
.app[data-theme="dark"] .select {
  background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F3ECEF' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' opacity='.55'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
}
.filters .select, .input.inline { background-position: right 12px center; }

/* Тёмная тема: денежная карточка остаётся героем, а не тонированным прямоугольником */
.app[data-theme="dark"] .cell.lilac {
  background: linear-gradient(150deg, #33202B 0%, #241A20 62%);
  border: 1px solid color-mix(in oklab, var(--accent) 34%, transparent);
  box-shadow: 0 22px 48px -28px rgba(0, 0, 0, .9), inset 0 1px 0 color-mix(in oklab, var(--accent) 18%, transparent);
}
.app[data-theme="dark"] .cell.lilac .stat .v, .app[data-theme="dark"] .cell.lilac .money { color: #FFE7F0; }
.app[data-theme="dark"] .cell.lilac .bars .bar.on i, .app[data-theme="dark"] .cell.lilac .heat i.on { background: var(--accent-ink); }
.app[data-theme="dark"] .cal-summary .cs.lilac { background: linear-gradient(150deg, #33202B, #241A20); border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent); }

/* Плитки календаря: ожидание — не акцент */
.cal-summary .cs.wait { background: var(--warn-soft); color: var(--warn); box-shadow: none; }
.cal-summary .cs.wait span { color: inherit; opacity: .75; }

/* QR печатается тёмным по светлому в любой теме */
.qr.light { background: #FFFFFF; border-color: rgba(0, 0, 0, .12); }
.qr.light i { background: #1F1A1C; }
.qr.light i.o { background: transparent; }

/* Шкала часов начинается с целой метки */
.cal .hours, .wk-body .hours { padding-top: 7px; }
.cal .hours div, .wk-body .hours div { transform: none; margin-top: -7px; }

/* День на десктопе: у одной колонки есть предел ширины */
.cal-wrap.day-one .cal { max-width: 760px; }

/* Повестка дня на телефоне: строки под палец */
.agenda-rows.big .agenda-row { grid-template-columns: 54px auto 1fr auto; min-height: 56px; padding: 10px; align-items: center; gap: 4px 8px; border-bottom: 1px solid var(--line); border-radius: 0; }
.agenda-rows.big .agenda-row:last-child { border-bottom: 0; }
.agenda-rows.big .agenda-row .num { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.15; }
