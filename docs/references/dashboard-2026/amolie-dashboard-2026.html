  const NAMES = ['Элина Круминя', 'Дарья Соколова', 'Инесе Заринья', 'Санта Озолиня', 'Анете Лиепиня', 'Мартиньш Берзиньш', 'Эдгар Приедитис', 'Лаура Витола', 'Юлия Новикова', 'Роберт Калнс'];

  /* Детерминированная неделя: для каждого мастера свой ритм, сегодня — из фикстур. */
  const weekFor = (c) => {
    const out = {};
    WEEK_DATES.forEach((d, di) => {
      if (d === TODAY) { out[d] = { bookings: c.bookings, slots: c.slots, blocks: c.blocks }; return; }
      if (di === 6) { out[d] = { bookings: [], slots: [], blocks: c.members.map((m) => ({ id: `wx${d}${m.id}`, member: m.id, start: 540, end: 1260, title: 'Выходной' })) }; return; }
      const bookings = [], slots = [], blocks = [];
      c.members.forEach((m, mi) => {
        const svc = c.services.filter((s) => s.performers.includes(m.id) && s.visible);
        if (!svc.length) return;
        let t = 600 + ((di * 7 + mi * 13) % 3) * 30;
        let k = 0;
        while (t < 1140) {
          const s = svc[(di + mi + k) % svc.length];
          const len = s.duration + (s.buffer || 0);
          const roll = (di * 31 + mi * 17 + k * 7) % 10;
          if (roll < 6) bookings.push({ id: `w${d}${m.id}${k}`, member: m.id, clientName: NAMES[(di * 3 + mi * 5 + k) % NAMES.length], service: s.id, start: t, end: t + s.duration, status: d < TODAY ? (roll === 5 ? 'noshow' : 'completed') : roll === 2 && d === 13 - 0 ? 'new' : d > TODAY && roll === 4 ? 'new' : 'confirmed' });
          else if (roll < 8 && d > TODAY) slots.push({ id: `ws${d}${m.id}${k}`, member: m.id, start: t, end: t + 60, hidden: roll === 7 && k % 3 === 0 });
          else if (roll === 9 && k === 2) blocks.push({ id: `wb${d}${m.id}`, member: m.id, start: t, end: t + 60, title: 'Обед' });
          t += Math.max(30, Math.round(len / 30) * 30) + (roll % 2 ? 30 : 0);
          k++;
        }
      });
      out[d] = { bookings, slots, blocks };
    });
    return out;
  };
  P.weekFor = weekFor;

  const laneTone = (id) => { const m = P.memberOf(id); return m ? m.tone : 'm1'; };
  const svcColor = (id) => P.serviceOf(id).color || 'transparent';

  P.SCREENS.calendar = {
    title: 'Календарь', hint: (st) => (P.ctx(st).team ? 'День команды: кто занят, где свободно' : 'Окна, в которые к вам можно записаться'),
    actions: () => btn('Рабочее время', { variant: 'secondary', icon: 'clock', action: 'sheet', args: { name: 'publishPeriod' } }) + btn('Запись', { variant: 'primary', icon: 'plus', action: 'sheet', args: { name: 'newBooking' } }),
    render(st) {
      const c = P.ctx(st);
      const view = st.ui.calView && st.ui.calView !== 'list' ? st.ui.calView : (c.team ? 'team' : 'day');
      const member = st.ui.calMember || 'all';
      const views = [...(st.caps.canViewTeamCalendar ? [['team', 'Команда']] : []), ['day', 'День'], ['week', 'Неделя']];
      const week = weekFor(c);
      const H = 60, top0 = 9 * 60, hours = Array.from({ length: 12 }, (_, i) => 9 + i);
      const px = (m) => ((m - top0) / 60) * H;
      const now = NOW();

      const soloMember = member;
      const toolbar = `
        <div class="cal-toolbar">
          ${btn('Сегодня', { size: 'sm', variant: 'secondary' })}
          <div class="row" style="gap:2px">${btn('', { size: 'sm', variant: 'ghost', icon: 'chevL', title: view === 'week' ? 'Предыдущая неделя' : 'Предыдущий день' })}${btn('', { size: 'sm', variant: 'ghost', icon: 'chevR', title: view === 'week' ? 'Следующая неделя' : 'Следующий день' })}</div>
          <div class="date">${view === 'week' ? '7 – 13 сентября' : '12 сентября'}<small>${view === 'week' ? 'эта неделя' : 'суббота · сегодня'}</small></div>
          <span style="flex:1"></span>
          ${c.team && !st.narrow ? P.seg([['all', 'Все'], ...c.members.map((m) => [m.id, m.short])], member, 'calMember') : ''}
          ${P.seg(views, view, 'calView')}
        </div>
        ${c.team && st.narrow && view === 'team' ? `<div class="cal-people">${P.seg([['all', 'Все'], ...c.members.map((m) => [m.id, m.short])], member, 'calMember')}</div>` : ''}
        <div class="daystrip">${WEEK_DATES.concat([14, 15, 16]).map((d, i) => { const n = week[d] ? week[d].bookings.length : 3; return `<button type="button" class="${d === TODAY ? 'on' : ''}"><span>${DAYS[i % 7]}</span><b>${d}</b><i style="${n ? '' : 'opacity:0'}"></i></button>`; }).join('')}</div>`;

      /* --- Событие --- */
      const ev = (b, o = {}) => {
        const s = P.serviceOf(b.service);
        const name = b.clientName || P.clientOf(b.client).name;
        const h = Math.max(20, px(b.end) - px(b.start) - 4);
        const compact = h < 40;
        const cur = b.start <= now && b.end > now && b.status === 'confirmed';
        return `<button type="button" class="ev busy ${compact ? 'compact' : ''} ${b.status === 'new' ? 'pending' : ''} ${b.status === 'completed' ? 'done' : ''} ${b.status === 'noshow' ? 'noshow' : ''} ${cur ? 'current' : ''} ${o.lane ? 'lane' : ''} ${c.team ? 'tone-' + laneTone(b.member) : ''}" style="top:${px(b.start)}px;height:${h}px;--svc:${svcColor(b.service)};${o.left != null ? `left:${o.left}%;width:calc(${o.width}% - 3px);` : ''}" title="${esc(name)} · ${esc(s.name)} · ${fmtTime(b.start)}–${fmtTime(b.end)}${o.member ? ` · ${esc(P.memberOf(b.member).short)}` : ''}"${act('openBooking', { id: b.id.startsWith('w') ? 'b6' : b.id })}>${o.lane ? '' : o.week ? `<b>${esc(name)}</b>` : `<b>${esc(name)}</b>${compact ? '' : `<span>${esc(s.name)}</span>`}${h >= 62 ? `<span class="t">${fmtTime(b.start)}–${fmtTime(b.end)}${o.member ? ` · ${esc(P.memberOf(b.member).short)}` : ''}</span>` : ''}`}${b.status === 'new' ? '<i class="pulse"></i>' : ''}</button>`;
      };
      const freeEv = (s, o = {}) => `<button type="button" class="ev free ${s.hidden ? 'hidden' : ''} ${o.lane ? 'lane' : ''}" style="top:${px(s.start)}px;height:${Math.max(20, px(s.end) - px(s.start) - 4)}px;${o.left != null ? `left:${o.left}%;width:calc(${o.width}% - 3px);` : ''}" title="Свободное окно ${fmtTime(s.start)}–${fmtTime(s.end)}"${act('sheet', { name: 'slotDetail', id: s.id.startsWith('w') ? 'f1' : s.id })}>${o.lane ? '' : `${s.hidden ? icon('eyeOff') : ''}${fmtTime(s.start)}`}</button>`;
      const blockEv = (x, o = {}) => `<div class="ev block ${o.lane ? 'lane' : ''}" style="top:${px(x.start)}px;height:${Math.max(20, px(x.end) - px(x.start) - 4)}px;${o.left != null ? `left:${o.left}%;width:calc(${o.width}% - 3px);` : ''}" role="button" tabindex="0" title="${esc(x.title)} ${fmtTime(x.start)}–${fmtTime(x.end)}"${act('sheet', { name: 'blockDetail', id: x.id.startsWith('w') ? 'x1' : x.id })}>${o.lane ? '' : `<b>${esc(x.title)}</b>`}</div>`;

      const colContent = (data, memberId, o = {}) => [
        ...data.blocks.filter((x) => x.member === memberId).map((x) => blockEv(x, o)),
        ...data.slots.filter((s) => s.member === memberId).map((s) => freeEv(s, o)),
        ...data.bookings.filter((b) => b.member === memberId).map((b) => ev(b, o)),
      ].join('');

      const hoursCol = `<div class="hours">${hours.map((h) => `<div>${String(h).padStart(2, '0')}:00</div>`).join('')}</div>`;
      const nowLine = `<div class="now-line" style="top:${px(now)}px"></div>`;

      /* --- День / Команда (колонки — люди) --- */
      const grid = (cols) => `
        <div class="cal" style="--h:${H}px;--n:12">
          <div></div>
          <div class="heads">${cols.map((m) => { const bs = c.bookings.filter((b) => b.member === m.id); const busy = bs.reduce((s2, b) => s2 + (b.end - b.start), 0); return `<div class="head ${cols.length > 1 ? 'tone-' + m.tone : 'today'}">${cols.length > 1 ? avatar(m, 'sm') : ''}<div class="txt"><b>${cols.length > 1 ? esc(m.short) : 'Сегодня, 12 сентября'}</b><small>${cols.length > 1 ? `${bs.length} ${plural(bs.length, ['запись', 'записи', 'записей'])} · ${Math.round(busy / 6) / 10} ч` : `${bs.length} ${plural(bs.length, ['запись', 'записи', 'записей'])} · свободно ${c.slots.filter((s) => s.member === m.id).length}`}</small></div><div class="loadbar"><i style="width:${Math.min(100, Math.round((busy / 600) * 100))}%"></i></div></div>`; }).join('')}</div>
          ${hoursCol}
          <div class="cols">${cols.map((m) => `<div class="col"${act('menuAt', { name: 'emptySlot', member: m.id })}>${colContent({ bookings: c.bookings, slots: c.slots, blocks: c.blocks }, m.id)}</div>`).join('')}${nowLine}</div>
        </div>`;

      /* --- Неделя --- */
      const weekView = () => {
        const lanes = c.team && member === 'all';
        const who = lanes ? c.members : c.team ? c.members.filter((m) => m.id === member) : c.members;
        const laneW = 100 / who.length;
        const dayCol = (d, di) => {
          const data = week[d];
          const past = d < TODAY, today = d === TODAY, off = di === 6;
          const inner = off ? `<div class="ev block full"><b>Выходной</b></div>` : who.map((m, mi) => colContent(data, m.id, lanes ? { lane: true, left: mi * laneW, width: laneW } : { week: true })).join('');
          return `<div class="wk-col ${past ? 'past' : ''} ${today ? 'today' : ''}"${off ? '' : act('menuAt', { name: 'emptySlot', member: who[0].id })}>${inner}${today ? nowLine : ''}</div>`;
        };
        const head = WEEK_DATES.map((d, di) => {
          const data = week[d]; const bs = data.bookings.filter((b) => who.some((m) => m.id === b.member)); const fs = data.slots.filter((s) => who.some((m) => m.id === s.member) && !s.hidden);
          const income = bs.filter((b) => b.status !== 'new' && b.status !== 'noshow').reduce((s2, b) => s2 + P.serviceOf(b.service).price, 0);
          return `<div class="wk-dh ${d === TODAY ? 'today' : ''} ${d < TODAY ? 'past' : ''}"><div class="dn"><span>${DAYS[di]}</span><b>${d}</b></div><div class="dm">${di === 6 ? 'выходной' : `${bs.length} ${plural(bs.length, ['запись', 'записи', 'записей'])}${fs.length ? ` · ${fs.length} ${plural(fs.length, ['окно', 'окна', 'окон'])}` : ''}`}</div>${di === 6 ? '' : `<div class="dm money">${income ? eur(income) : '—'}</div>`}</div>`;
        }).join('');
        if (st.narrow) {
          const load = WEEK_DATES.map((d, di) => { const data = week[d]; const bs = data.bookings.filter((b) => who.some((m) => m.id === b.member)); const fs = data.slots.filter((x) => who.some((m) => m.id === x.member) && !x.hidden); const income = bs.filter((b) => b.status !== 'new' && b.status !== 'noshow').reduce((s2, b) => s2 + P.serviceOf(b.service).price, 0); return { d, di, n: bs.length, f: fs.length, income, off: di === 6 }; });
          const maxN = Math.max(1, ...load.map((x) => x.n));
          return `<div class="cell mb12"><div class="cell-head"><div class="titles"><h2 class="t-section">Неделя 7–13 сентября</h2><div class="t-meta mt-2">${P.countOf(load.reduce((a2, x) => a2 + x.n, 0), ['запись', 'записи', 'записей'])} · ${eur(load.reduce((a2, x) => a2 + x.income, 0))}</div></div></div>
            <div class="wk-load">${load.map((x) => `<button type="button" class="wl ${x.d === TODAY ? 'on' : ''} ${x.off ? 'off' : ''}"${act('calView', { value: 'day' })}><span class="dn">${DAYS[x.di]}</span><b>${x.d}</b><i style="height:${x.off ? 3 : Math.max(6, (x.n / maxN) * 100)}%"></i><span class="n">${x.off ? '—' : x.n}</span></button>`).join('')}</div>
            <div class="wk-load-cap"><span>записей в день</span><span>свободных окон за неделю: ${load.reduce((a2, x) => a2 + x.f, 0)}</span></div>
          </div>
          <div class="cell">${WEEK_DATES.map((d, di) => { const data = week[d]; const bs = data.bookings.filter((b) => who.some((m) => m.id === b.member)).sort((a, b) => a.start - b.start); const fs = data.slots.filter((s) => who.some((m) => m.id === s.member) && !s.hidden); const off = di === 6; return `<div class="agenda-day ${d === TODAY ? 'today' : ''}"><h3><b>${DAYS_FULL[di]}, ${d}</b>${d === TODAY ? ' <span class="chip xs">сегодня</span>' : ''} <span class="n">${off ? 'выходной' : `${bs.length} ${plural(bs.length, ['запись', 'записи', 'записей'])}${fs.length ? ` · ${fs.length} ${plural(fs.length, ['окно', 'окна', 'окон'])}` : ''}`}</span></h3>${off ? '' : `<div class="agenda-rows">${bs.map((b) => `<button type="button" class="agenda-row ${b.status}"${act('openBooking', { id: b.id.startsWith('w') ? 'b6' : b.id })}><span class="num">${fmtTime(b.start)}</span><i class="member-dot" style="--ev:var(--${laneTone(b.member)})"></i><b>${esc(b.clientName || P.clientOf(b.client).name)}</b><span class="svc">${esc(P.serviceOf(b.service).name)}</span></button>`).join('')}${fs.length ? `<div class="agenda-free">${fs.slice(0, 4).map((f) => `<button type="button" class="chip xs"${act('sheet', { name: 'slotDetail', id: f.id.startsWith('w') ? 'f1' : f.id })}>${fmtTime(f.start)}</button>`).join('')}${fs.length > 4 ? `<span class="t-meta">ещё ${fs.length - 4}</span>` : ''}</div>` : ''}</div>`}</div>`; }).join('')}</div>`;
        }
        const legend = lanes ? `<div class="wk-legend">${who.map((m) => `<span><i class="lane ${m.tone}"></i>${esc(m.short)}</span>`).join('')}<span class="muted" style="margin-left:auto">Дорожки по мастерам · наведите на блок, нажмите — откроется запись</span></div>` : c.team ? `<div class="wk-legend">${who.map((m) => `<span><i class="lane ${m.tone}"></i>${esc(m.short)}</span>`).join('')}</div>` : '';
        return `<div class="cell flush wk-wrap">
          ${legend}
          <div class="wk" style="--h:${H}px;--n:12">
            <div class="wk-head"><div class="wk-corner"></div>${head}</div>
            <div class="wk-body">${hoursCol}${WEEK_DATES.map(dayCol).join('')}</div>
          </div>
        </div>`;
      };

      const agendaDay = (who) => {
        const bs = c.bookings.filter((b) => who.some((m) => m.id === b.member)).sort((a, b) => a.start - b.start);
        const fs = c.slots.filter((x) => who.some((m) => m.id === x.member) && !x.hidden);
        const xs = c.blocks.filter((x) => who.some((m) => m.id === x.member));
        const rows = [...bs.map((b) => ({ t: b.start, kind: 'b', b })), ...xs.map((x) => ({ t: x.start, kind: 'x', x }))].sort((p, q) => p.t - q.t);
        return `<div class="cell">
          ${rows.length ? `<div class="agenda-rows big">${rows.map((r) => r.kind === 'x'
            ? `<button type="button" class="agenda-row block"${act('sheet', { name: 'blockDetail', id: r.x.id })}><span class="num">${fmtTime(r.x.start)}</span><b>${esc(r.x.title)}</b><span class="svc">до ${fmtTime(r.x.end)}</span></button>`
            : `<button type="button" class="agenda-row ${r.b.status}"${act('openBooking', { id: r.b.id })}><span class="num">${fmtTime(r.b.start)}<small>${P.fmtDurShort(r.b.end - r.b.start)}</small></span>${c.team ? `<i class="member-dot" style="--ev:var(--${laneTone(r.b.member)})"></i>` : ''}<b>${esc(P.clientOf(r.b.client).name)}</b><span class="svc">${esc(P.serviceOf(r.b.service).name)}</span>${status(r.b.status)}</button>`).join('')}</div>`
            : P.empty('Сегодня записей нет', 'Откройте время, чтобы клиенты могли записаться.', btn('Открыть время', { variant: 'primary', size: 'sm', icon: 'clock', action: 'sheet', args: { name: 'publishSlot' } }))}
          ${fs.length ? `<div class="cat-head">Свободные окна <span class="n">${fs.length}</span></div><div class="chips">${fs.map((f) => `<button type="button" class="chip free"${act('sheet', { name: 'slotDetail', id: f.id })}>${fmtTime(f.start)}–${fmtTime(f.end)}</button>`).join('')}</div>` : ''}
        </div>`;
      };
      let body = '';
      const teamCols = member !== 'all' ? c.members.filter((m) => m.id === member) : c.members;
      if (st.narrow && view !== 'week') body = agendaDay(c.team && member !== 'all' ? c.members.filter((m) => m.id === member) : c.members);
      else if (view === 'team') body = `<div class="cell flush cal-wrap">${grid(teamCols)}</div>`;
      else if (view === 'day') { const who = c.team ? c.members.find((m) => m.id === (member !== 'all' ? member : 'anna')) : c.members[0]; body = `<div class="cell flush cal-wrap day-one">${grid([who])}</div>`; }
      else body = weekView();

      const summary = view === 'week' ? '' : `<div class="cal-summary">${[
        ['Записей сегодня', c.bookings.length, ''],
        ['Ждут ответа', c.bookings.filter((b) => b.status === 'new').length, 'wait'],
        ['Свободных окон', c.slots.filter((s) => !s.hidden).length, ''],
        ['Ожидаемый доход', eur(c.bookings.filter((b) => b.status !== 'new').reduce((s2, b) => s2 + P.serviceOf(b.service).price, 0)), 'lilac'],
      ].map(([k, v, tone]) => `<div class="cs ${tone}"><span>${k}</span><b class="money">${v}</b></div>`).join('')}</div>`;
      return st.narrow ? toolbar + body + summary : toolbar + summary + body;
    },
  };

  /* ============================================================ ЗАПИСИ */
  const FILTERS = [['all', 'Все'], ['new', 'Новые'], ['confirmed', 'Подтверждённые'], ['completed', 'Завершённые'], ['cancelled', 'Отменённые']];
  P.SCREENS.bookings = {
    title: 'Записи', hint: 'Все записи: новые, будущие и прошедшие',
    actions: () => btn('CSV', { variant: 'ghost', icon: 'download', action: 'toast', args: { msg: 'Файл bookings.csv скачивается' } }) + btn('Запись', { variant: 'primary', icon: 'plus', action: 'sheet', args: { name: 'newBooking' } }),
    render(st) {
      const c = P.ctx(st);
      const f = st.ui.bkFilter || 'all';
      const week = weekFor(c);
      const q = (st.ui.bkQ || '').trim().toLowerCase();
      const nameOf = (b) => b.clientName || P.clientOf(b.client).name;
      const match = (b) => !q || [nameOf(b), P.serviceOf(b.service).name, (P.clientOf(b.client) || {}).phone].some((x) => String(x || '').toLowerCase().includes(q));
      const next = week[10].bookings.slice(0, 3).map((b, i) => ({ ...b, day: ['пн 14', 'пн 14', 'вт 15'][i], start: [660, 720, 600][i], status: 'confirmed' }));
      const past = week[9].bookings.slice(0, 3).map((b, i) => ({ ...b, day: ['чт 10', 'ср 9', 'ср 9'][i], start: [660, 900, 600][i], status: ['completed', 'noshow', 'completed'][i] }));
      const cancelled = [{ id: 'cx1', clientName: 'Роберт Калнс', service: c.team ? 's-cut-m' : 's-mani', member: c.team ? 'davis' : 'neve', day: 'пт 11', start: 1080, status: 'cancelled' }];
      const all = [...c.bookings, ...next, ...past, ...cancelled];
      const counts = FILTERS.reduce((acc, [v]) => { acc[v] = all.filter((b) => (v === 'all' || b.status === v || (v === 'cancelled' && b.status === 'noshow')) && match(b)).length; return acc; }, {});
      const keep = (b) => (f === 'all' || b.status === f || (f === 'cancelled' && b.status === 'noshow')) && match(b);
      const other = (b) => `<div class="visit click" role="button" tabindex="0"${act('openBooking', { id: b.id.startsWith('w') || b.id.startsWith('c') ? (st.role === 'solo' ? 'n3' : 'b6') : b.id })}><div class="t num" style="font-size:13px">${b.day}<small>${fmtTime(b.start)}</small></div><div class="who"><b>${esc(b.clientName)}</b><span>${esc(P.serviceOf(b.service).name)}${c.team ? ` <i class="member-dot" style="--ev:var(--${laneTone(b.member)})"></i>${esc(P.memberOf(b.member).short)}` : ''}</span></div><div class="acts">${status(b.status)}</div></div>`;
      const groups = [
        ['Ждут подтверждения', c.bookings.filter((b) => b.status === 'new' && keep(b)).map((b) => P.visitRow(b, { member: c.team }))],
        ['Сегодня', c.bookings.filter((b) => b.status !== 'new' && keep(b)).sort((a, b) => a.start - b.start).map((b) => P.visitRow(b, { member: c.team }))],
        ['Дальше', next.filter(keep).map(other)],
        ['Прошедшие', past.filter(keep).map(other)],
        ['Отменённые', cancelled.filter(keep).map(other)],
      ].filter(([, rows]) => rows.length);
      return `<div class="cell">
        <div class="input-wrap mb12">${icon('search', 'lead')}${P.liveInput('bkQ', { placeholder: 'Имя, телефон или услуга', cls: 'inline' })}</div>
        <div class="chips scroll mb16">${FILTERS.map(([v, l]) => `<button type="button" class="chip xs ${v === f ? 'on' : ''}"${act('bkFilter', { value: v })}>${l} <span class="n">${counts[v]}</span></button>`).join('')}</div>
        ${groups.length ? groups.map(([g, rows]) => `<div class="cat-head">${g} <span class="n">${rows.length}</span></div><div class="list">${rows.join('')}</div>`).join('') : P.empty(q ? `По запросу «${esc(st.ui.bkQ)}» ничего нет` : 'Таких записей нет', q ? 'Проверьте имя или телефон — поиск ищет по клиенту и услуге.' : 'Снимите фильтр или создайте запись.', q ? btn('Очистить поиск', { variant: 'secondary', size: 'sm', action: 'setUi', args: { key: 'bkQ', value: '' } }) : btn('Новая запись', { variant: 'primary', size: 'sm', icon: 'plus', action: 'sheet', args: { name: 'newBooking' } }))}
        <div class="pager"><span>${q ? `найдено ${P.countOf(counts[f], ['запись', 'записи', 'записей'])}` : `показаны все ${P.countOf(counts[f], ['запись', 'записи', 'записей'])}`}</span></div>
      </div>`;
    },
  };
})(window.P);

</script>
<script>
/* ===== sheets.js ===== */
/* Шторки, диалоги и меню. Шторка: { title, hint, size, body(st,a), foot(st,a) }. Диалог: { title, text, confirm, danger }. Меню: (st,a) → [{label, icon, action, args, danger}] */
(function (P) {
  const { icon, btn, esc, act, status, avatar, fmtTime, fmtDur, eur } = P;
  const sec = (title, body) => `<div class="sheet-section"><h3>${title}</h3>${body}</div>`;
  /* Закон подвала: слева отмена, справа главное действие. Разрушительное живёт в теле, в своей зоне. */
  const foot = (primary, o = {}) => `${btn(o.cancel || 'Отмена', { variant: 'ghost', action: 'closeSheet' })}<span class="grow"></span>${o.extra || ''}${primary}`;
  const danger = (title, body) => `<div class="sheet-section danger-zone"><h3>${title}</h3>${body}</div>`;
  const SWATCHES = ['', '#E2568A', '#C9426F', '#9164C4', '#684096', '#2E7A58', '#9A6712'];
  const memberSelect = (st, value) => (P.ctx(st).team ? P.field('Мастер', P.select(P.ctx(st).members.map((m) => [m.id, m.name]), value || 'anna')) : '');

  P.SHEETS = {
    newBooking: {
      title: 'Новая запись', hint: 'Клиент, услуги и время — и запись готова',
      body(st, a) {
        const c = P.ctx(st);
        const client = a.clientId ? P.clientOf(a.clientId) : null;
        const picked = st.ui.nbServices || ['s-mani-gel'];
        const total = picked.reduce((s, id) => s + P.serviceOf(id).price, 0), dur = picked.reduce((s, id) => s + P.serviceOf(id).duration, 0);
        return `
        ${sec('Кто придёт', (a.error === 'client' ? '<div class="field-error">Выберите клиента — без него запись не создать</div>' : '') + (client ? `<div class="row" style="padding:10px 12px;border-radius:12px;background:var(--sunken)">${avatar(client)}<div style="flex:1"><b style="font-weight:500">${esc(client.name)}</b><div class="t-meta num">${esc(client.phone)} · ${P.countOf(client.visits, ['визит', 'визита', 'визитов'])}</div></div>${btn('Изменить', { size: 'xs', variant: 'ghost', action: 'sheetArg', args: { key: 'clientId', value: null } })}</div>` : `<div class="input-wrap">${icon('search', 'lead')}${P.input({ placeholder: 'Имя или телефон' })}</div><div class="list" style="margin-top:2px">${P.CLIENTS.filter((x) => !x.dup).slice(0, 3).map((x) => `<button type="button" class="list-row click" style="grid-template-columns:auto 1fr auto;padding:8px 10px"${act('sheetArg', { key: 'clientId', value: x.id })}>${avatar(x, 'sm')}<div><div class="main-line" style="font-weight:400">${esc(x.name)}</div><div class="sub-line num">${esc(x.phone)} · ${P.countOf(x.visits, ['визит', 'визита', 'визитов'])}</div></div>${x.flag === 'fav' ? status('lilac', 'Любимый') : ''}</button>`).join('')}<button type="button" class="list-row click" style="grid-template-columns:auto 1fr;padding:8px 10px;color:var(--accent-ink)"${act('sheetArg', { key: 'clientId', value: 'k9' })}>${icon('plus')}<div class="main-line" style="font-weight:500">Новый клиент</div></button></div>`))}
        ${sec('Услуги', `<div class="chips">${c.services.filter((s) => s.visible).map((s) => `<button type="button" class="chip ${picked.includes(s.id) ? 'on' : ''}"${act('nbToggle', { id: s.id })}>${esc(s.name)} <span style="opacity:.7">· ${eur(s.price)}</span></button>`).join('')}</div>${c.services.filter((s) => picked.some((p) => (P.serviceOf(p).addons || []).includes(s.id)) && !picked.includes(s.id)).length ? `<div class="t-meta">Предложить дополнительно: ${c.services.filter((s) => picked.some((p) => (P.serviceOf(p).addons || []).includes(s.id)) && !picked.includes(s.id)).map((s) => esc(s.name)).join(', ')}</div>` : ''}`)}
        ${memberSelect(st, a.memberId)}
        ${sec('Когда', `${P.seg([['slots', 'Из свободных окон'], ['custom', 'Своё время']], st.ui.nbWhen || 'slots', 'nbWhen', 'block')}${(st.ui.nbWhen || 'slots') === 'slots' ? `<div class="t-meta">Сегодня, 12 сентября · нужно ${fmtDur(dur)} подряд</div><div class="chips">${['16:00', '17:00', '19:30'].map((t, i) => `<button type="button" class="chip ${i === 0 ? 'on' : ''}">${t}</button>`).join('')}</div><div class="chips"><span class="t-meta">пн 14 сен</span>${['10:00', '11:30', '14:00', '16:30'].map((t) => `<button type="button" class="chip">${t}</button>`).join('')}</div>` : `<div class="form-grid">${P.field('Дата', P.pickField('date', 'nb-date', 'сб, 12 сентября'))}${P.field('Время', P.pickField('time', 'nb-time', '16:00'))}</div><div class="t-meta">Окно на это время откроется и сразу займётся этой записью — на публичной странице оно свободным не появится.</div>`}`)}
        ${sec('Заметка', P.textarea({ placeholder: 'Видите только вы', rows: 2 }))}`;
      },
      foot(st) { const picked = st.ui.nbServices || ['s-mani-gel']; const total = picked.reduce((s, id) => s + P.serviceOf(id).price, 0), dur = picked.reduce((s, id) => s + P.serviceOf(id).duration, 0); return `${btn('Отмена', { variant: 'ghost', action: 'closeSheet' })}<div class="grow total"><span class="t-meta">Итого</span><b class="money">${eur(total)}</b><span class="t-meta">· ${fmtDur(dur)}</span></div>${btn('Создать запись', { variant: 'primary', action: 'submit', args: { msg: 'Запись создана', requireArg: 'clientId', error: 'client' } })}`; },
    },

    bookingDetail: {
      title: (st, a) => esc(P.clientOf(P.bookingOf(st, a.id).client).name), hint: (st, a) => { const b = P.bookingOf(st, a.id); return `${b.status === 'new' ? '<span class="tag-new">ждёт ответа</span>' : status(b.status)} <span class="muted">· создана ${esc(b.created)}${b.source === 'page' ? ', со страницы записи' : ''}</span>`; },
      body(st, a) {
        const b = P.bookingOf(st, a.id), cl = P.clientOf(b.client), s = P.serviceOf(b.service), m = P.memberOf(b.member);
        const now = P.NOW.h * 60 + P.NOW.m;
        const started = b.start <= now, done = b.status === 'completed' || b.status === 'cancelled' || b.status === 'noshow';
        return `
        <div class="cell rose" style="padding:16px 18px"><div class="row between"><div><div class="t-meta" style="color:inherit;opacity:.7">Сегодня, 12 сентября</div><div class="money" style="font-size:30px;line-height:1.1">${fmtTime(b.start)}–${fmtTime(b.end)}</div><div class="t-meta mt8" style="color:inherit;opacity:.8">${fmtDur(b.end - b.start)}${P.ctx(st).team ? ` · ${esc(m.short)}` : ''}</div></div>${done ? '' : btn('Перенести', { size: 'sm', variant: 'secondary', icon: 'move', action: 'sheet', args: { name: 'reschedule', id: b.id } })}</div></div>
        ${b.status === 'new' ? `<div class="row">${btn('Отклонить запись', { variant: 'ghost-danger', icon: 'x', action: 'dialog', args: { name: 'declineBooking', id: b.id } })}</div>` : ''}
        ${b.status === 'confirmed' && started ? `<div class="row">${btn('Клиент не пришёл', { variant: 'ghost-danger', icon: 'alert', action: 'noShow', args: { id: b.id } })}</div>` : b.status === 'confirmed' ? '<div class="t-meta">Завершить визит можно, когда он начнётся. Пока — перенести или отменить.</div>' : ''}
        ${sec('Клиент', `<div class="row" style="align-items:flex-start">${avatar(cl)}<div style="flex:1;min-width:0"><b style="font-weight:500">${esc(cl.name)}</b>${cl.visits === 0 ? ' <span class="chip xs">первый визит</span>' : ''}<div class="t-meta num">${esc(cl.phone)} · визитов: ${cl.visits}${cl.flag === 'fav' ? ' · любимый клиент' : ''}</div><div class="row mt8 wrap">${btn('Позвонить', { size: 'xs', variant: 'secondary', icon: 'phone' })}${btn('Написать', { size: 'xs', variant: 'secondary', icon: 'msg', action: 'menuAt', args: { name: 'write' } })}${btn('Карточка', { size: 'xs', variant: 'ghost', action: 'nav', args: { name: 'client', id: cl.id, close: true } })}</div></div></div>`)}
        ${sec('Услуги', `<div class="list"><div class="list-row" style="grid-template-columns:1fr auto;padding:8px 0"><div><div class="main-line" style="font-weight:400">${esc(s.name)}</div><div class="sub-line">${fmtDur(s.duration)}${s.buffer ? ` + ${s.buffer} мин на уборку` : ''}</div></div><b class="num" style="font-weight:500">${eur(s.price)}</b></div></div><div class="row between"><span class="t-meta">Итого</span><b class="money" style="font-size:18px">${eur(s.price)}</b></div>`)}
        ${sec('Заметка', `<div class="t-body">${b.note ? esc(b.note) : '<span class="muted">Заметки нет</span>'}</div>`)}
        ${b.status === 'confirmed' && b.source === 'page' ? '<div class="t-meta">Клиент может отменить сам за сутки до визита. Позже — только через вас.</div>' : ''}
        ${done ? '' : danger('Если визит не состоится', `${btn('Отменить запись', { size: 'sm', variant: 'ghost-danger', icon: 'x', action: 'dialog', args: { name: 'cancelBooking', id: b.id } })}<span class="t-meta">Клиент увидит запись как отменённую. Вернуть её будет нельзя.</span>`)}`;
      },
      foot(st, a) {
        const b = P.bookingOf(st, a.id); const done = ['completed', 'cancelled', 'noshow'].includes(b.status);
        const started = b.start <= P.NOW.h * 60 + P.NOW.m;
        const main = b.status === 'new' ? btn('Подтвердить запись', { variant: 'primary', icon: 'check', action: 'confirmBooking', args: { id: b.id, close: true } })
          : b.status === 'confirmed' && started ? btn('Завершить визит', { variant: 'primary', icon: 'check', action: 'completeBooking', args: { id: b.id, close: true } })
          : btn(done ? 'Изменить заметку' : 'Изменить запись', { variant: 'primary', icon: done ? '' : 'edit', action: 'sheet', args: { name: 'editBooking', id: b.id } });
        const extra = !done && (b.status === 'new' || (b.status === 'confirmed' && started)) ? btn('Изменить', { variant: 'secondary', icon: 'edit', action: 'sheet', args: { name: 'editBooking', id: b.id } }) : '';
        return foot(main, { cancel: 'Закрыть', extra });
      },
    },

    editBooking: {
      title: 'Изменить запись', hint: 'Правкой время не меняется. Чтобы перенести визит — «Перенести» в карточке записи.',
      body(st, a) { const b = P.bookingOf(st, a.id); const c = P.ctx(st); return `${sec('Услуги', `<div class="chips">${c.services.filter((s) => s.visible).map((s) => `<button type="button" class="chip ${s.id === b.service ? 'on' : ''}">${esc(s.name)} <span style="opacity:.7">· ${eur(s.price)}</span></button>`).join('')}</div><div class="t-meta">Для выбранных услуг нужно ${fmtDur(P.serviceOf(b.service).duration)} подряд — время есть.</div>`)}${memberSelect(st, b.member)}${sec('Заметка', P.textarea({ value: b.note, placeholder: 'Видите только вы', rows: 3 }))}`; },
      foot: () => foot(btn('Сохранить', { variant: 'primary', action: 'submit', args: { msg: 'Запись изменена' } })),
    },

    reschedule: {
      title: 'Перенести запись', hint: 'Клиент получит уведомление',
      body(st, a) { const b = P.bookingOf(st, a.id); const picks = st.ui.picks || {}; const nd = picks['rs-date'] || 'пн, 14 сентября'; const nt = picks['rs-time'] || '11:30'; return `<div class="move-pair"><div class="from"><span class="t-meta">Сейчас</span><b class="num">сегодня, ${fmtTime(b.start)}</b></div><i class="arrow" aria-hidden="true">${icon('arrowR')}</i><div class="to"><span class="t-meta">Новое время</span><b class="num">${esc(nd.replace(/^[а-я]{2}, /, ''))}, ${esc(nt)}</b></div></div>${sec('Выберите дату и время', `<div class="form-grid">${P.field('Дата', P.pickField('date', 'rs-date', 'пн, 14 сентября'))}${P.field('Время', P.pickField('time', 'rs-time', '11:30'))}</div><div class="t-meta">Свободные окна в этот день</div><div class="chips">${['10:00', '11:30', '14:00', '16:30'].map((t) => `<button type="button" class="chip ${nt === t ? 'on' : ''}"${act('pickSet', { key: 'rs-time', value: t })}>${t}</button>`).join('')}</div>`)}`; },
      foot: () => foot(btn('Перенести запись', { variant: 'primary', action: 'submit', args: { msg: 'Запись перенесена' } }), { cancel: 'Оставить как есть' }),
    },

    clientForm: {
      title: (st, a) => (a.id ? 'Редактировать клиента' : 'Новый клиент'), hint: 'Метку и заметку видите только вы — клиент их не увидит.',
      body(st, a) { const c = a.id ? P.clientOf(a.id) : {}; return `<div class="form-grid">${P.field('Имя', P.input({ value: c.name || '', placeholder: 'Имя и фамилия' }), '', { cls: 'full' })}${P.field('Телефон', P.input({ value: c.phone || '', placeholder: '+371' }))}${P.field('Почта', P.input({ value: c.email || '', placeholder: 'необязательно' }))}</div>${sec('Метка', `<div class="radio-cards">${[['', 'Без метки', ''], ['fav', 'Любимый клиент', 'Стоит рядом с именем везде'], ['attention', 'Осторожно', 'Напоминание себе']].map(([v, t, d]) => `<button type="button" class="radio-card ${(c.flag || '') === v ? 'on' : ''}"><i></i><div><b>${t}</b>${d ? `<span>${d}</span>` : ''}</div></button>`).join('')}</div>`)}${sec('Заметка', P.textarea({ value: c.notes || '', placeholder: 'То, что не спросишь дважды', rows: 3 }))}${a.id ? danger('Осторожные действия', `<div class="row wrap">${btn('Заблокировать клиента', { size: 'sm', variant: 'ghost-danger', icon: 'block', action: 'dialog', args: { name: 'blockClient', id: a.id } })}${btn('Удалить карточку', { size: 'sm', variant: 'ghost-danger', icon: 'trash', action: 'dialog', args: { name: 'deleteClient', id: a.id } })}</div><span class="t-meta">Блокировка закрывает клиенту запись на вашей странице. Удаление стирает карточку, история визитов остаётся.</span>`) : ''}`; },
      foot: () => foot(btn('Сохранить', { variant: 'primary', action: 'submit', args: { msg: 'Сохранено' } })),
    },

    blockTime: {
      title: 'Заблокировать время', hint: 'Клиенты не смогут записаться на это время, а открытые окна в нём снимутся',
      body(st, a) { return `${sec('Причина', `<div class="chips">${['Обед', 'Перерыв', 'Личное', 'Отпуск'].map((t, i) => `<button type="button" class="chip ${i === 0 ? 'on' : ''}">${t}</button>`).join('')}</div>${P.input({ value: 'Обед', placeholder: 'Например, обед' })}`)}${memberSelect(st, a.memberId)}${sec('Когда', `${P.field('Дата', P.pickField('date', 'bt-date', 'пн, 14 сентября'))}${P.switchRow('Весь день', '', false)}<div class="form-grid">${P.field('С', P.pickField('time', 'bt-from', '13:00'))}${P.field('До', P.pickField('time', 'bt-to', '14:00'))}</div>`)}${sec('Повтор', `${P.seg([['none', 'Не повторять'], ['weekly', 'Каждую неделю']], 'weekly', 'noop', 'block')}${P.field('До даты', P.pickField('date', 'bt-until', 'чт, 31 декабря'))}`)}<div class="t-meta">В это время открыто 1 окно — оно снимется. Записей клиентов нет.</div>`; },
      foot: () => foot(btn('Заблокировать', { variant: 'primary', action: 'submit', args: { msg: 'Время заблокировано, снято окон: 1' } })),
    },

    blockDetail: {
      title: 'Заблокированное время', hint: 'Клиентам это время не показывается',
      body(st, a) { const x = [...P.BLOCKS, ...P.SOLO_BLOCKS].find((b) => b.id === a.id) || P.BLOCKS[0]; const m = P.memberOf(x.member); return `<div class="cell tight" style="background:var(--sunken);box-shadow:none"><b style="font-weight:500;font-size:16px">${esc(x.title)}</b><div class="t-meta mt8">сегодня ${fmtTime(x.start)}–${fmtTime(x.end)} · ${fmtDur(x.end - x.start)}${P.ctx(st).team ? ` · ${esc(m.short)}` : ''}</div><div class="t-meta">повторяется каждую неделю до 31 декабря</div></div><div class="t-meta">Окна, снятые блоком, сами не вернутся — откройте время заново, если оно снова ваше.</div>${btn('Снять только сегодня', { size: 'sm', variant: 'secondary', action: 'submit', args: { msg: 'Блок снят на сегодня' } })}`; },
      foot: () => foot(btn('Снять блок', { variant: 'danger', action: 'submit', args: { msg: 'Блок снят' } }), { cancel: 'Закрыть' }),
    },

    slotDetail: {
      title: 'Свободное окно', hint: 'Клиент видит его на странице записи', more: (st, a) => ({ name: 'slotMore', id: a.id }),
      body(st, a) { const s = [...P.SLOTS, ...P.SOLO_SLOTS].find((x) => x.id === a.id) || P.SLOTS[0]; return `<div class="cell tight" style="border:1.5px dashed var(--accent-ink);box-shadow:none"><b class="num" style="font-weight:500;font-size:22px">${fmtTime(s.start)}–${fmtTime(s.end)}</b><div class="t-meta mt8">сегодня, 12 сентября · ${fmtDur(s.end - s.start)}${P.ctx(st).team ? ` · ${esc(P.memberOf(s.member).short)}` : ''}</div>${s.hidden ? `<div class="mt8">${status('plain', 'Скрыто от клиентов')}</div>` : ''}</div>${sec('Перенести окно', `<div class="form-grid">${P.field('Дата', P.pickField('date', 'sd-date', 'сб, 12 сентября'))}${P.field('Время', P.pickField('time', 'sd-time', fmtTime(s.start)))}</div>${btn('Перенести окно', { size: 'sm', variant: 'secondary', action: 'submit', args: { msg: 'Окно перенесено' } })}`)}${danger('Убрать окно', `${btn('Удалить окно', { size: 'sm', variant: 'ghost-danger', icon: 'trash', action: 'dialog', args: { name: 'deleteSlot', id: a.id } })}<span class="t-meta">Окно исчезнет со страницы записи. ${s.hidden ? 'Сейчас оно и так скрыто от клиентов.' : 'Скрыть его на время можно в меню шторки.'}</span>`)}`; },
      foot: (st, a) => foot(btn('Записать клиента', { variant: 'primary', icon: 'plus', action: 'sheet', args: { name: 'newBooking', replace: true } }), { cancel: 'Закрыть' }),
    },

    publishSlot: {
      title: 'Открыть время', hint: 'Клиенты видят только то время, которое вы открыли',
      body(st, a) { return `<div class="seg block"><button type="button" class="on">Одно окно</button><button type="button"${act('sheet', { name: 'publishPeriod', replace: true })}>Период или повтор</button></div><div class="form-grid">${P.field('Дата', P.pickField('date', 'ps-date', 'сб, 12 сентября'))}${P.field('Время', P.pickField('time', 'ps-time', a.time || '16:30'))}${P.field('Длительность', P.select([['30', '30 мин'], ['60', '1 ч'], ['90', '1 ч 30 мин'], ['120', '2 ч']], '60'))}${P.ctx(st).team ? P.field('Мастер', P.select(P.ctx(st).members.map((m) => [m.id, m.name]), a.member || 'anna')) : ''}</div><div class="t-meta">Окно откроется на странице записи сразу. Чтобы открыть неделю или месяц, переключитесь наверху на «Период или повтор».</div>`; },
      foot: () => foot(btn('Опубликовать окно', { variant: 'primary', action: 'submit', args: { msg: 'Открыто окно 16:30', undo: true } })),
    },

    publishPeriod: {
      title: 'Опубликовать период', hint: 'Окна создаются явно — шаблонов рабочих часов нет',

<script>
/* ===== app.js ===== */
/* Оболочка: роли, навигация, состояние, рендер, действия. */
(function (P) {
  const { icon, btn, esc, act, avatar } = P;

  P.ROLES = {
    solo: { label: 'Соло-мастер', org: 'Neve Nails', plan: 'Соло · Рига', home: 'home' },
    owner: { label: 'Владелица салона', org: 'Lumen Studio', plan: 'Салон · 5 человек', home: 'home' },
    admin: { label: 'Администратор салона', org: 'Lumen Studio', plan: 'Салон · 5 человек', home: 'home' },
    master: { label: 'Мастер в салоне', org: 'Lumen Studio', plan: 'Ногтевой сервис', home: 'home' },
    platform: { label: 'Администратор платформы', org: 'AMOLIE', plan: 'Панель платформы', home: 'admin-home' },
  };
  const caps = (role) => {
    const salon = role !== 'solo', team = salon;
    const owner = role === 'owner' || role === 'solo', admin = role === 'admin', master = role === 'master';
    return {
      hasTeam: team, canManageCalendar: role !== 'platform', canViewTeamCalendar: team && (owner || admin), canManageBookings: true, canManageClients: true,
      canViewServices: true, canManageServices: owner || admin, canManagePage: owner || admin, canManageWorkspace: owner, canManageTeam: salon && (owner || admin),
      canViewFinance: owner || admin, canManagePayouts: role === 'owner', canViewOwnPayouts: master, isPlatform: role === 'platform',
    };
  };

  const navFor = (st) => {
    const c = st.caps;
    if (c.isPlatform) return [
      { key: 'admin-home', label: 'Сводка', hint: 'Платформа за 30 дней', icon: 'grid', group: 'Платформа' }, { key: 'admin-masters', label: 'Мастера', hint: 'Все, кто ведёт запись', icon: 'user', group: 'Платформа' }, { key: 'admin-organizations', label: 'Салоны', hint: 'Заведения с командой', icon: 'building', group: 'Платформа' }, { key: 'admin-users', label: 'Пользователи', hint: 'Клиенты, мастера и админы', icon: 'clients', group: 'Платформа' },
      { key: 'admin-requests', label: 'Заявки', hint: 'Очередь на подключение', icon: 'inbox', group: 'Операции', badge: 6, badgeTone: 'amber' }, { key: 'admin-bookings', label: 'Записи', hint: 'Все визиты платформы', icon: 'bookings', group: 'Операции' }, { key: 'admin-subscriptions', label: 'Подписки', hint: 'Тарифы и продления', icon: 'card', group: 'Операции' }, { key: 'admin-announcements', label: 'Объявления', hint: 'Полосы в кабинетах', icon: 'megaphone', group: 'Операции' },
      { key: 'admin-health', label: 'Состояние', hint: 'Службы и очереди', icon: 'activity', group: 'Система' }, { key: 'admin-logs', label: 'Логи', hint: 'Кто и что делал', icon: 'file', group: 'Система' }, { key: 'admin-settings', label: 'Настройки', hint: 'Правила платформы', icon: 'settings', group: 'Система' },
    ];
    const pending = P.ctx(st).bookings.filter((b) => b.status === 'new').length;
    const items = [
      { key: 'home', label: 'Сегодня', hint: 'Что сегодня и как идут дела', icon: 'home' },
      { key: 'calendar', label: 'Календарь', hint: 'Окна, в которые к вам можно записаться', icon: 'calendar' },
      { key: 'bookings', label: 'Записи', hint: 'Все записи: новые, будущие и прошедшие', icon: 'bookings', badge: pending },
      c.canViewTeamCalendar && { key: 'front-desk', label: 'Ресепшен', hint: 'Кто сейчас в креслах, кого ждать', icon: 'clock' },
      { key: 'clients', label: 'Клиенты', hint: 'Ваша база: заметки и история визитов', icon: 'clients' },
      { key: 'services', label: 'Услуги', hint: 'Что вы делаете и сколько это стоит', icon: 'services' },
      c.canManagePage && { key: 'page', label: 'Страница', hint: 'То, что видят клиенты по вашей ссылке', icon: 'globe' },
      c.canManageTeam && { key: 'team', label: 'Команда', hint: 'Кто работает и что каждому доступно', icon: 'team' },
      c.canViewFinance && { key: 'finance', label: 'Финансы', hint: 'Сколько заработано', icon: 'finance' },
      c.canViewOwnPayouts && { key: 'payouts', label: 'Заработок', hint: 'Ваши утверждённые выплаты', icon: 'banknote' },
      { key: 'settings', label: 'Настройки', hint: 'Ваш вход и язык кабинета', icon: 'settings', group: 'Рабочее место' },
    ].filter(Boolean);
    return items;
  };

  P.tabKeys = (s) => (s.caps.isPlatform ? ['admin-home', 'admin-requests', 'admin-masters', 'admin-organizations'] : ['home', 'calendar', 'bookings']);
  const st = { role: 'owner', theme: 'light', device: 'desktop', route: { name: 'home' }, ui: {}, sheets: [], dialog: null, menu: null, toasts: [], palette: false };
  P.state = st;
  const sync = () => { st.caps = caps(st.role); st.nav = navFor(st); };
  sync();

  /* ---------- Рендер ---------- */
  const screenOf = () => {
    const s = P.SCREENS[st.route.name];
    if (!s) return P.SCREENS.nosection;
    const allowed = st.caps.isPlatform ? st.route.name.startsWith('admin-') : !st.route.name.startsWith('admin-') && (st.nav.some((n) => n.key === st.route.name) || ['client', 'member', 'start', 'studio', 'payouts'].includes(st.route.name));
    if (!allowed) return P.SCREENS.nosection;
    if (st.route.name === 'member' && !st.caps.canManageTeam) return P.SCREENS.nosection;
    if (st.route.name === 'payouts' && !(st.caps.canManagePayouts || st.caps.canViewOwnPayouts)) return P.SCREENS.nosection;
    if (st.route.name === 'studio' && !st.caps.canManagePage) return P.SCREENS.nosection;
    return s;
  };
  const val = (v) => (typeof v === 'function' ? v(st) : v);
  const activeKey = () => ({ client: 'clients', member: 'team', studio: 'page', start: 'home', payouts: st.caps.canViewOwnPayouts ? 'payouts' : 'finance', 'admin-master': 'admin-masters' }[st.route.name] || st.route.name);

  const rail = () => {
    const role = P.ROLES[st.role], me = P.ctx(st).me;
    let lastGroup = null;
    return `<nav class="rail" aria-label="Основная навигация">
      <div class="wordmark"><span class="mark">a</span><b>AMOLIE</b></div>
      <div class="org"><div class="name">${esc(role.org)}</div><div class="plan">${esc(role.plan)}</div></div>
      ${st.nav.map((it) => { const g = it.group && it.group !== lastGroup ? `<div class="group-label">${it.group}</div>` : ''; lastGroup = it.group || lastGroup; return `${g}<button type="button" class="nav-item ${activeKey() === it.key ? 'on' : ''}"${it.external ? act('toast', { msg: 'Открыли бы письмо в support@amolie.com' }) : act('nav', { name: it.key })}>${icon(it.icon)}<span>${it.label}</span>${it.badge ? `<span class="badge ${it.badgeTone || ''}">${it.badge}</span>` : ''}</button>`; }).join('')}
      <div class="rail-foot"><button type="button" class="me"${act('menuAt', { name: 'account' })}>${avatar(me)}<div><div class="who">${esc(me.name)}</div><div class="role">${esc(role.label)}</div></div></button></div>
    </nav>`;
  };

  const topbar = () => {
    const unread = P.activityOf(st).filter((a) => a.unread).length;
    return `<div class="topbar">
      <div class="search" role="button" tabindex="0"${act('palette')}>${icon('search')}<span>${st.caps.isPlatform ? 'Поиск по мастерам, салонам, пользователям и разделам…' : 'Поиск по клиентам, записям и действиям…'}</span><kbd>⌘K</kbd></div><span class="spacer"></span>
      <div class="clock"><b>${P.NOW.label}</b><small>сб, 12 сентября</small></div>
      ${st.caps.isPlatform ? '' : P.iconBtn('bell', 'menuAt', { args: { name: 'activity' }, title: 'Что нового', dot: unread > 0 })}
      ${P.iconBtn(st.theme === 'dark' ? 'sun' : 'moon', 'setTheme', { args: { value: st.theme === 'dark' ? 'light' : 'dark' }, title: 'Переключить тему' })}
      ${st.caps.isPlatform ? '' : btn('Создать', { variant: 'secondary', icon: 'plus', action: 'menuAt', args: { name: 'create' } })}
    </div>`;
  };

  const mobileTop = (screen) => {
    const back = val(screen.back);
    const title = screen.mobileTitle ? screen.mobileTitle(st) : val(screen.title);
    const unread = P.activityOf(st).filter((a) => a.unread).length;
    return `<div class="mobile-top">
      ${back ? P.iconBtn('arrowL', 'nav', { args: { name: back }, cls: 'ghost back', title: 'Назад' }) : ''}
      <div class="title">${title}</div>
      ${P.iconBtn('search', 'palette', { cls: 'ghost', title: 'Поиск' })}
      ${st.caps.isPlatform ? '' : P.iconBtn('bell', 'sheet', { args: { name: 'activity' }, cls: 'ghost', title: 'Что нового', dot: unread > 0 })}
      <button type="button" class="avatar sm ${P.ctx(st).me.tone}"${act('menuAt', { name: 'account' })} aria-label="Аккаунт">${P.initials(P.ctx(st).me.name)}</button>
    </div>`;
  };

  const tabbar = () => {
    const keys = P.tabKeys(st);
    const tabs = keys.map((k) => st.nav.find((n) => n.key === k)).filter(Boolean);
    const tab = (t) => `<button type="button" class="${activeKey() === t.key ? 'on' : ''}"${act('nav', { name: t.key })}>${icon(t.icon)}<span>${t.label}</span>${t.badge ? `<span class="badge ${t.badgeTone || ''}">${t.badge}</span>` : ''}</button>`;

  };

    let h = '';
    const bad = [];

      const def = P.SHEETS[sh.name]; if (!def) return;

        const title = typeof def.title === 'function' ? def.title(st, a) : def.title;

        const body = def.body(st, a);
        const foot = def.foot ? def.foot(st, a) : '';
        h += `<div class="overlay"${act('closeSheet')}></div><section class="sheet ${def.size || ''}" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g, ''))}" style="z-index:${31 + i}">
        <div class="handle"></div>
        <div class="sheet-head"><div class="titles"><h2>${title}</h2>${hint ? `<div class="t-hint">${hint}</div>` : ''}</div>${def.more ? P.iconBtn('more', 'menuAt', { args: def.more(st, a), cls: 'ghost sm', title: 'Ещё' }) : ''}${P.iconBtn('x', 'closeSheet', { cls: 'ghost sm', title: 'Закрыть' })}</div>
        <div class="sheet-body">${body}</div>
        ${foot ? `<div class="sheet-foot">${foot}</div>` : '<div></div>'}
      </section>`;
      } catch (err) { console.error('sheet', sh.name, err); bad.push(sh); }
    });
    if (bad.length) st.sheets = st.sheets.filter((x) => !bad.includes(x));
    if (st.dialog) {
      const d = P.DIALOGS[st.dialog.name];
      h += `<div class="overlay" style="z-index:${40}"${act('closeDialog')}></div><div class="dialog" role="alertdialog" style="z-index:41"><h2>${typeof d.title === 'function' ? d.title(st, st.dialog.args) : d.title}</h2><p>${typeof d.text === 'function' ? d.text(st, st.dialog.args) : d.text}</p><div class="acts">${btn('Отмена', { variant: 'ghost', action: 'closeDialog' })}${btn(d.confirm, { variant: d.danger ? 'danger' : 'primary', action: 'confirmDialog' })}</div></div>`;
    }
    if (st.menu) {
      const items = P.MENUS[st.menu.name](st, st.menu.args);
      const list = items.map((it) => it.head ? `<div class="menu-head">${it.head}</div>` : it.hr ? '<hr>' : `<button type="button" class="${it.danger ? 'danger' : ''}"${act(it.action, { ...(it.args || {}), closeMenu: true })}>${it.icon ? icon(it.icon) : ''}<span>${it.label}</span></button>`).join('');
      const headItem = items.find((it) => it.head);
      if (st.narrow) h += `<div class="overlay" style="z-index:42"${act('closeMenu')}></div><div class="dialog sheet-like" style="z-index:43"><div class="handle"></div><div class="sheet-head"><div class="titles"><h2>${headItem ? headItem.head : 'Действия'}</h2></div>${P.iconBtn('x', 'closeMenu', { cls: 'ghost sm', title: 'Закрыть' })}</div><div class="menu" style="position:static;box-shadow:none;border:0;animation:none">${items.filter((it) => !it.head).map((it) => it.hr ? '<hr>' : `<button type="button" class="${it.danger ? 'danger' : ''}"${act(it.action, { ...(it.args || {}), closeMenu: true })}>${it.icon ? icon(it.icon) : ''}<span>${it.label}</span></button>`).join('')}</div></div>`;
      else h += `<div class="overlay" style="background:transparent;z-index:42"${act('closeMenu')}></div><div class="menu" style="z-index:43;left:${st.menu.x}px;top:${st.menu.y}px;${st.menu.right ? `left:auto;right:${st.menu.right}px;` : ''}">${list}</div>`;
    }
    if (st.palette) {
      h += `<div class="overlay" style="z-index:44"${act('closePalette')}></div><div class="palette" style="z-index:45" role="dialog" aria-label="Быстрый поиск">
        <div class="in">${icon('search')}<input id="palette-input" placeholder="${st.caps.isPlatform ? 'Мастер, салон, раздел' : 'Имя, телефон, действие'}" autocomplete="off" value="${esc(st.ui.q || '')}">${btn('Отмена', { variant: 'ghost', size: 'sm', cls: 'palette-cancel', action: 'closePalette' })}</div>
        <div class="res" id="palette-res">${paletteResults()}</div>
        <div class="foot"><span><kbd>↑↓</kbd>выбрать</span><span><kbd>↵</kbd>открыть</span><span><kbd>esc</kbd>закрыть</span></div>
      </div>`;
    }
    h += `<div class="toasts">${st.toasts.map((t) => `<div class="toast"><span>${esc(t.msg)}</span>${t.undo ? `<button type="button"${act('undoToast', { id: t.id })}>Вернуть</button>` : ''}</div>`).join('')}</div>`;
    return h;
  };

  const paletteResults = () => {
    const q = (st.ui.q || '').trim().toLowerCase();
    const hit = (...xs) => !q || xs.some((x) => String(x || '').toLowerCase().includes(q));
    const groups = [];
    if (st.caps.isPlatform) {
      const A = P.ADMIN;
      groups.push(['Мастера и салоны', A.masters.filter((m) => hit(m.name, m.org, m.email)).slice(0, 4).map((m) => ({ icon: null, av: { name: m.name, tone: m.type === 'solo' ? 'm1' : 'm2' }, label: m.name, meta: `${m.org} · ${m.type === 'solo' ? 'мастер' : 'салон'}`, k: 'карточка', action: 'nav', args: { name: 'admin-master', id: m.id } }))]);
      groups.push(['Пользователи', A.users.filter((u) => hit(u.name, u.contact)).slice(0, 3).map((u) => ({ av: { name: u.name, tone: 'm3' }, label: u.name, meta: u.contact, k: 'открыть', action: 'nav', args: { name: 'admin-users' } }))]);
      groups.push(['Заявки', A.requests.filter((r) => hit(r.name, r.email, r.city)).slice(0, 3).map((r) => ({ icon: 'inbox', label: r.name, meta: `${r.city} · ${r.when}`, k: 'разобрать', action: 'nav', args: { name: 'admin-requests' } }))]);
      groups.push(['Разделы', st.nav.filter((n) => hit(n.label)).slice(0, 6).map((n) => ({ icon: n.icon, label: n.label, k: 'перейти', action: 'nav', args: { name: n.key } }))]);
    } else {
      groups.push(['Клиенты', P.CLIENTS.filter((c) => !c.dup && hit(c.name, c.phone)).slice(0, 4).map((c) => ({ av: c, label: c.name, meta: `${c.phone} · визитов: ${c.visits}`, k: 'открыть', action: 'nav', args: { name: 'client', id: c.id } }))]);
      groups.push(['Действия', P.createItems(st).filter((it) => hit(it.label, it.hint)).map((it) => ({ icon: it.icon, label: it.label, meta: it.hint, k: 'выполнить', action: it.action, args: it.args }))]);
      groups.push(['Разделы', st.nav.filter((n) => !n.external && hit(n.label, n.hint)).slice(0, 6).map((n) => ({ icon: n.icon, label: n.label, k: 'перейти', action: 'nav', args: { name: n.key } }))]);
    }
    const rows = groups.filter(([, xs]) => xs.length);
    if (!rows.length) return `<div class="empty"><b>Ничего не нашлось</b><p>Попробуйте имя, телефон или название раздела.</p></div>`;
    let first = true;
    return rows.map(([g, xs]) => `<div class="grp">${g}</div>${xs.map((x) => { const on = first ? 'on' : ''; first = false; return `<button type="button" class="it ${on}"${act(x.action, { ...x.args, closePalette: true })}>${x.av ? avatar(x.av, 'sm') : icon(x.icon || 'search')}<span>${esc(x.label)}</span>${x.meta ? `<span class="t-meta num">${esc(x.meta)}</span>` : ''}<span class="k">${x.k}</span></button>`; }).join('')}`).join('');
  };
  P.render = () => {
    sync();
    const app = document.getElementById('app');
    app.dataset.theme = st.theme;
    st.narrow = app.clientWidth <= 760;
    const screen = screenOf();
    const isFull = screen.full;
    const head = isFull ? '' : `<div class="page-head">${val(screen.crumb) ? `<div style="flex-basis:100%"><div class="crumbs"><a href="#"${act('nav', { name: val(screen.back) })}>${val(screen.crumb)}</a><span>/</span><span>${val(screen.title)}</span></div></div>` : ''}<div><h1>${val(screen.title)}</h1>${val(screen.hint) ? `<div class="sub">${val(screen.hint)}</div>` : ''}</div><div class="actions">${screen.actions ? screen.actions(st) : ''}</div></div>`;
    app.innerHTML = `
      <div class="statusbar"><span>${P.NOW.label}</span><span class="bat">5G <i></i></span></div><div class="home-ind"></div>
      ${rail()}
      <div class="main">
        ${isFull ? '' : topbar()}
        ${isFull ? '' : mobileTop(screen)}
        ${isFull || !screen.actions ? '' : `<div class="mobile-actions">${screen.actions(st)}</div>`}
        ${isFull ? screen.render(st) : `<div class="page ${st.enter ? 'enter' : ''}" id="page">${head}${screen.render(st)}</div>`}
      </div>
      ${isFull ? '' : tabbar()}
      ${overlays()}`;
    if (st.palette) { const i = document.getElementById('palette-input'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); i.addEventListener('input', () => { st.ui.q = i.value; const r = document.getElementById('palette-res'); if (r) r.innerHTML = paletteResults(); }); } }
    const onChip = document.querySelector('#app .chips.scroll .chip.on');
    if (onChip && onChip.scrollIntoView) onChip.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (st.focusLive) { const el = document.querySelector(`[data-live="${st.focusLive}"]`); if (el) { el.focus(); const v = el.value.length; el.setSelectionRange(v, v); } st.focusLive = null; }
    const sc = document.getElementById('page'); if (sc && st.scrollTop != null) { sc.scrollTop = st.scrollTop; st.scrollTop = null; }
    st.enter = false;
    const onStep = document.querySelector('#app .onb-step.on'); if (onStep && onStep.scrollIntoView) onStep.scrollIntoView({ block: 'nearest', inline: 'center' });
    P.syncBar();
  };

  /* ---------- Действия ---------- */
  const keepScroll = () => { const sc = document.getElementById('page'); st.scrollTop = sc ? sc.scrollTop : 0; };
  let toastId = 0;
  const toast = (msg, undo) => { const id = ++toastId; st.toasts.push({ id, msg, undo }); P.render(); setTimeout(() => { if (!st.toasts.some((t) => t.id === id)) return; st.toasts = st.toasts.filter((t) => t.id !== id); keepScroll(); P.render(); }, 3600); };
  P.toast = toast;
  const closeAll = () => { st.sheets = []; st.dialog = null; st.menu = null; st.palette = false; };
  const ACTIONS = {
    nav(a) { if (a.close) st.sheets = []; if (a.closePalette) { st.palette = false; st.ui.q = ''; } st.menu = null; st.enter = a.name !== st.route.name; st.route = { name: a.name, id: a.id }; if (a.view) st.ui.calView = a.view; if (a.member) st.ui.calMember = a.member; if (a.filter) st.ui.bkFilter = a.filter; st.scrollTop = 0; },
    sheet(a) { if (a.closePalette) { st.palette = false; st.ui.q = ''; } st.menu = null; if (a.replace && st.sheets.length) st.sheets.pop(); if (st.sheets.length && st.sheets[st.sheets.length - 1].name === a.name) st.sheets.pop(); if (a.name === 'create' && !st.narrow) { st.menu = { name: 'create', x: 0, y: 66, right: 32 }; return; } st.sheets.push({ name: a.name, args: { ...a } }); },
    closeSheet() { st.sheets.pop(); st.ui.nbServices = null; st.ui.nbWhen = null; },
    sheetArg(a) { const top = st.sheets[st.sheets.length - 1]; if (top) { top.args[a.key] = a.value; if (a.key === 'clientId' && a.value) top.args.error = null; } },
    dialog(a) { st.menu = null; st.dialog = { name: a.name, args: a }; },
    closeDialog() { st.dialog = null; },
    confirmDialog() { const d = P.DIALOGS[st.dialog.name]; const isLogout = st.dialog.name === 'logout'; st.dialog = null; if (['cancelBooking', 'declineBooking', 'deleteSlot', 'deleteService', 'deleteCategory', 'deleteClient', 'studioRevert', 'blockClient', 'deleteDraft'].includes(Object.keys(P.DIALOGS).find((k) => P.DIALOGS[k] === d))) st.sheets = []; if (isLogout) { st.sheets = []; } toast(d.msg, d.undo); },
    menuAt(a, el, ev) { if (st.menu && st.menu.name === a.name) { st.menu = null; return; } const app = document.getElementById('app').getBoundingClientRect(); const r = el.getBoundingClientRect(); const menuW = 260; let x = r.left - app.left, y = r.bottom - app.top + 6; if (a.name === 'emptySlot' && ev) { x = ev.clientX - app.left; y = ev.clientY - app.top + 4; } if (x + menuW > app.width - 12) x = app.width - menuW - 12; if (y + 280 > app.height) y = Math.max(12, app.height - 292); st.menu = { name: a.name, args: a, x, y }; if (a.name === 'account' && !st.narrow) { st.menu.y = r.top - app.top - 230; } if (a.name === 'pick') { st.menu.x = r.left - app.left; if (st.menu.x + menuW > app.width - 12) st.menu.x = app.width - menuW - 12; } },
    closeMenu() { st.menu = null; },
    palette() { st.palette = true; },
    closePalette() { st.palette = false; st.ui.q = ''; },
    toast(a) { if (a.closeMenu) st.menu = null; toast(a.msg, a.undo); },
    undoToast(a) { st.toasts = st.toasts.filter((t) => t.id !== a.id); toast('Возвращено'); },
    submit(a, el) {
      const top = st.sheets[st.sheets.length - 1];
      if (top && a.requireArg && !top.args[a.requireArg]) { top.args.error = a.error; return; }
      if (top && a.requireInput) { const sheetEl = el.closest('.sheet'); const inp = sheetEl && sheetEl.querySelector(a.requireInput); if (inp && !inp.value.trim()) { top.args.error = a.error; return; } }
      st.sheets.pop(); st.ui.nbServices = null; st.ui.nbWhen = null; toast(a.msg, a.undo);
    },
    pickSet(a) { st.menu = null; st.ui.picks = st.ui.picks || {}; st.ui.picks[a.key] = a.value; },
    setUi(a) { st.ui[a.key] = a.value; },
    toggleUi(a) { st.ui[a.key] = !st.ui[a.key]; },
    studioCtx(a) { st.ui.studioCtx = a.value; st.ui.studioSec = a.value === 'page' ? 'style' : a.value === 'booking' ? 'bk-order' : 'st-live'; },
    studioPanel() { st.ui.studioPanel = !st.ui.studioPanel; },
    bkFilter(a) { st.ui.bkFilter = a.value; },
    obWorld(a) { st.ui.obWorld = a.value; },
    confirmBooking(a) { const b = P.bookingOf(st, a.id); b.status = 'confirmed'; if (a.close) st.sheets = []; st.menu = null; toast('Запись подтверждена — клиент увидит это сразу'); },
    completeBooking(a) { const b = P.bookingOf(st, a.id); b.status = 'completed'; if (a.close) st.sheets = []; st.menu = null; toast('Визит отмечен завершённым', true); },
    noShow(a) { const b = P.bookingOf(st, a.id); b.status = 'noshow'; if (a.close) st.sheets = []; st.menu = null; toast('Отмечено: клиент не пришёл', true); },
    openBooking(a) { st.menu = null; st.sheets.push({ name: 'bookingDetail', args: { id: a.id } }); },
    setTheme(a) { st.menu = null; st.theme = a.value === 'system' ? 'light' : a.value; },
    setTab(a) { st.ui.setTab = a.value; st.scrollTop = 0; },
    calView(a) { st.ui.calView = a.value; }, calMember(a) { st.ui.calMember = a.value; }, svcTab(a) { st.ui.svcTab = a.value; }, pageTab(a) { st.ui.pageTab = a.value; }, period(a) { st.ui.period = a.value; }, req(a) { st.ui.req = a.value; if (a.open != null) st.ui.reqOpen = a.open; st.scrollTop = 0; },
    step(a, el) {
      if (a.require && !a.skip) { const inp = document.getElementById('ob-' + a.require); if (inp && !inp.value.trim()) { st.ui.obError = a.require; return; } }
      st.ui.obError = null; st.ui.step = a.value; st.scrollTop = 0;
    },
    studioSec(a) { st.ui.studioSec = st.ui.studioSec === a.value ? null : a.value; }, studioDev(a) { st.ui.studioDev = a.value; }, studioWorld(a) { st.ui.studioWorld = a.value; },
    nbWhen(a) { st.ui.nbWhen = a.value; }, nbToggle(a) { const cur = st.ui.nbServices || ['s-mani-gel']; st.ui.nbServices = cur.includes(a.id) ? cur.filter((x) => x !== a.id) : [...cur, a.id]; },
    toggle(a, el) { el.classList.toggle('on'); el.setAttribute('aria-checked', el.classList.contains('on')); const bar = document.querySelector('#app .save-bar'); if (bar && el.closest('#page')) bar.classList.add('on'); return false; },
    noop() { return false; },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || !document.getElementById('app').contains(el)) return;
    e.preventDefault();
    const a = el.dataset.args ? JSON.parse(el.dataset.args) : {};
    if (el.classList.contains('switch') && el.dataset.action !== 'toggle') { el.classList.toggle('on'); }
    const fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    if (!['nav', 'step'].includes(el.dataset.action)) keepScroll();
    const r = fn(a, el, e);
    if (a.closeMenu) st.menu = null;
    if (r !== false) P.render();
  });
  let liveTimer = null;
  document.addEventListener('input', (e) => {
    const el = e.target.closest && e.target.closest('[data-live]');
    if (!el) return;
    const key = el.dataset.live;
    st.ui[key] = el.value;
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => { keepScroll(); st.focusLive = key; P.render(); }, 180);
  });
  document.addEventListener('input', (e) => { if (e.target.closest && e.target.closest('#page') && !e.target.dataset.live) { const bar = document.querySelector('#app .save-bar'); if (bar) bar.classList.add('on'); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (st.palette) { st.palette = false; st.ui.q = ''; } else if (st.menu) st.menu = null; else if (st.dialog) st.dialog = null; else if (st.sheets.length) st.sheets.pop(); else return; keepScroll(); P.render(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); st.palette = !st.palette; keepScroll(); P.render(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest && e.target.closest('[role="button"][data-action]')) e.target.click(); });

  /* ---------- Панель прототипа ---------- */
  P.syncBar = () => {
    const roleSel = document.getElementById('role'); if (roleSel) roleSel.value = st.role;
    document.querySelectorAll('[data-theme-btn]').forEach((b) => b.classList.toggle('on', b.dataset.themeBtn === st.theme));
    document.querySelectorAll('[data-device-btn]').forEach((b) => b.classList.toggle('on', b.dataset.deviceBtn === st.device));
    document.querySelector('.stage').dataset.device = st.device;
    const list = document.getElementById('screen');
    if (list) {
      const screens = st.caps.isPlatform ? st.nav.map((n) => [n.key, n.label]) : [...st.nav.filter((n) => !n.external).map((n) => [n.key, n.label]), ['client', 'Карточка клиента'], st.caps.canManageTeam && ['member', 'Карточка мастера'], st.caps.canManagePayouts && ['payouts', 'Выплаты'], st.caps.canManagePage && ['studio', 'Студия'], ['start', 'Онбординг']].filter(Boolean);
      const sheets = st.caps.isPlatform ? [['rejectRequest', 'Отклонить заявку'], ['assignPlan', 'Тариф'], ['plans', 'Тарифы'], ['announcement', 'Объявление']] : [['newBooking', 'Новая запись'], ['bookingDetail', 'Карточка записи'], ['editBooking', 'Изменить запись'], ['reschedule', 'Перенести'], ['clientForm', 'Клиент'], ['publishSlot', 'Открыть время'], ['publishPeriod', 'Опубликовать период'], ['clearPeriod', 'Окна за период'], ['blockTime', 'Заблокировать время'], ['blockDetail', 'Блок'], ['slotDetail', 'Свободное окно'], st.caps.canManageServices && ['serviceForm', 'Услуга'], st.caps.canManageServices && ['categoryForm', 'Категория'], st.caps.canManageTeam && ['invite', 'Приглашение'], st.caps.canManagePayouts && ['compensation', 'Условия расчёта'], ['activity', 'Что нового'], ['create', 'Создать']].filter(Boolean);
      list.innerHTML = `<option value="">Перейти к экрану…</option><optgroup label="Экраны">${screens.map(([k, l]) => `<option value="s:${k}">${l}</option>`).join('')}</optgroup><optgroup label="Шторки и окна">${sheets.map(([k, l]) => `<option value="sh:${k}">${l}</option>`).join('')}<option value="d:logout">Диалог: выйти</option><option value="p:">Поиск ⌘K</option></optgroup>`;
      list.value = '';
    }
  };
  document.getElementById('role').addEventListener('change', (e) => { st.role = e.target.value; st.ui = {}; closeAll(); sync(); st.enter = true; st.route = { name: P.ROLES[st.role].home }; P.render(); });
  document.querySelectorAll('[data-theme-btn]').forEach((b) => b.addEventListener('click', () => { st.theme = b.dataset.themeBtn; P.render(); }));
  document.querySelectorAll('[data-device-btn]').forEach((b) => b.addEventListener('click', () => { st.device = b.dataset.deviceBtn; st.menu = null; P.render(); }));
  document.getElementById('screen').addEventListener('change', (e) => {
    const [kind, key] = e.target.value.split(':'); if (!kind) return;
    closeAll(); st.scrollTop = 0;
    if (kind === 's') { st.enter = true; st.route = { name: key, id: key === 'client' ? 'k1' : key === 'member' ? 'anna' : key === 'admin-master' ? 'm2' : undefined }; }
    if (kind === 'sh') { if (!st.caps.isPlatform && st.route.name.startsWith('admin-')) st.route = { name: 'home' }; st.sheets = [{ name: key, args: { org: key === 'assignPlan' ? 'Lumen Studio' : undefined, id: key === 'bookingDetail' || key === 'editBooking' || key === 'reschedule' ? (st.role === 'solo' ? 'n3' : 'b6') : key === 'clientForm' ? 'k1' : key === 'serviceForm' ? 's-mani-gel' : key === 'categoryForm' ? 'c-nails' : key === 'compensation' ? 'anna' : key === 'blockDetail' ? (st.role === 'solo' ? 'nx1' : 'x1') : key === 'slotDetail' ? (st.role === 'solo' ? 'nf1' : 'f1') : undefined } }]; }
    if (kind === 'd') st.dialog = { name: key, args: {} };
    if (kind === 'p') st.palette = true;
    P.render();
  });
  window.addEventListener('resize', () => { const app = document.getElementById('app'); const n = app.clientWidth <= 760; if (n !== st.narrow) { st.menu = null; P.render(); } });
  P.render();
})(window.P);

</script>
</body>
</html>
