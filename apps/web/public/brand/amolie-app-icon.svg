<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>AMOLIE</title>
  <!--
    Знак приложения: фигура человека под аркой — голова и свод, тот же свод,
    что несёт логотип, но без перекладины, потому что на 16 px перекладина
    первой превращается в грязь.

    Геометрия построена от одного центра: внешняя дуга радиусом 94 и
    внутренняя радиусом 42 концентричны (линия пят y=292), поэтому толщина
    ноги ровно 52 на всём повороте. Голова — круг r=48 с зазором 14 до свода;
    зазор равен четверти толщины ноги и держится на всех размерах.

    Знак вписан в круг радиусом 192 от центра поля — это меньше 40% стороны,
    то есть он целиком лежит в safe zone `maskable`, и система вправе обрезать
    иконку под свою форму, ничего не задев.
  -->
  <rect width="512" height="512" rx="112" fill="#FDF6F8" />
  <g fill="#A63A5F">
    <circle cx="256" cy="136" r="48" />
    <path d="M162 423V292a94 94 0 0 1 188 0v131h-52V292a42 42 0 0 0-84 0v131Z" />
  </g>
</svg>
