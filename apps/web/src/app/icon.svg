<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>AMOLIE</title>
  <!--
    Favicon вкладки — копия `public/brand/amolie-favicon.svg` (знак крупнее в
    поле на 20%, чтобы нога пережила растеризацию на 16 px). Рядом лежит
    `favicon.ico` тем же знаком: браузер выберет один из двух, и оба обязаны
    показывать одно и то же. Оба порождаются из этого файла —
    `scripts/brand-raster.mjs`.
  -->
  <!--
    Палитра — мира лендинга: чернильное поле #0E0E10 и розовый знак #E2568A,
    5.45:1 между ними. Не палитра кабинета, хотя знак один и тот же: вкладку
    открывают на публичном сайте, а он с 2026-08-18 чернильный, и светло-розовый
    квадрат в ряду вкладок читался как чужой. Иконка установленного приложения
    (`amolie-app-icon.svg`) остаётся в палитре кабинета — её видят там,
    где кабинет и живёт.
  -->
  <rect width="512" height="512" rx="112" fill="#0E0E10" />
  <g fill="#E2568A" transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <circle cx="256" cy="136" r="48" />
    <path d="M162 423V292a94 94 0 0 1 188 0v131h-52V292a42 42 0 0 0-84 0v131Z" />
  </g>
</svg>
