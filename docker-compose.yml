name: beauty-lv

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beauty_lv
    ports:
      - '5432:5432'
    volumes:
      - beauty_lv_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - beauty_lv_redis:/data

volumes:
  beauty_lv_postgres:
  beauty_lv_redis:
