<!-- @dsCard group="Colors" viewport="700x170" subtitle="Pink marks occupied time, free time stays empty" name="Accent as status" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); font-weight: var(--weight-ui); }
</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px;max-width:520px">
  <div style="display:grid;grid-template-columns:3px 56px 1fr auto;gap:14px;align-items:center;background:var(--surface-row);padding:13px 14px 13px 0">
    <span style="background:var(--status-busy);align-self:stretch"></span>
    <span style="font-size:14px;opacity:.6">10:00</span><span style="font-size:15px">Марина К. / окрашивание</span><span style="font-size:12px;opacity:.45">2 ч</span>
  </div>
  <div style="display:grid;grid-template-columns:3px 56px 1fr auto;gap:14px;align-items:center;border:1px dashed var(--border-strong);padding:12px 13px 12px 0">
    <span></span><span style="font-size:14px;opacity:.6">13:15</span><span style="font-size:15px;opacity:.5">Свободно</span><span style="font-size:12px;opacity:.45">45 мин</span>
  </div>
</div>
</body></html>
