<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); font-weight: var(--weight-ui); }
</style></head><body>
<style>
  .m { animation: amolie-rise-in var(--duration-enter) var(--ease) both; }
</style>
<div style="display:flex;flex-direction:column;gap:10px">
  <span class="m" style="animation-delay:0ms;font-size:15px">cubic-bezier(.22, 1, .36, 1)</span>
  <span class="m" style="animation-delay:50ms;font-size:15px;opacity:.75">translateY(28px) → 0</span>
  <span class="m" style="animation-delay:100ms;font-size:15px;opacity:.55">blur(14px) → 0</span>
</div>
</body></html>
