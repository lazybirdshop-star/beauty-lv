<!-- @dsCard group="Colors" viewport="700x150" subtitle="The cabinet theme — cool field, white rows" name="Light surfaces" -->
<!doctype html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); font-weight: var(--weight-ui); }
</style></head><body>
<div style="display:flex;gap:14px">
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
    <div style="height:56px;background:#F1F2F4;"></div>
    <div style="font-size:13px">--light-field</div>
    <div style="font-size:12px;opacity:.55">Фон кабинета</div>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
    <div style="height:56px;background:#FFFFFF;"></div>
    <div style="font-size:13px">--light-card</div>
    <div style="font-size:12px;opacity:.55">Строка записи</div>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
    <div style="height:56px;background:#14131A;border:1px solid var(--border-subtle);"></div>
    <div style="font-size:13px">--light-ink</div>
    <div style="font-size:12px;opacity:.55">Текст</div>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
    <div style="height:56px;background:rgba(20,19,26,0.14);"></div>
    <div style="font-size:13px">--light-hairline</div>
    <div style="font-size:12px;opacity:.55">Разделитель 1px</div>
  </div>
</div>
</body></html>
